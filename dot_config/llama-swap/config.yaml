# llama-swap — local VRAM model swapper in front of the ~/bin/llama-* wrappers.
# Each model's `cmd` just CALLS the existing wrapper with the swap-assigned ${PORT},
# so every tuned flag (CUDA, MTP, KV-quant, samplers, MODE) is preserved — the
# wrappers stay the single source of truth. See ~/notes/LLM-STACK.md for the full design.
#
# Run:   llama-swap --config ~/.config/llama-swap/config.yaml --listen 127.0.0.1:9292
# Then:  curl http://127.0.0.1:9292/v1/models   |  web UI at http://127.0.0.1:9292/ui
# Install (host): paru -S llama-swap   (AUR)  OR  grab a release binary from
#   https://github.com/mostlygeek/llama-swap/releases  (Go, single binary, MIT, 4.5k★)
#
# VALIDATE before relying on it:  llama-swap --config <this> --listen 127.0.0.1:9292
#   prints config errors on startup. The `groups`/`routing` schema moved between versions
#   (see the commented block at the bottom) — verify against your installed version.

healthCheckTimeout: 300   # wrappers do no-mmap loads (+ first-run downloads) — be generous
globalTTL: 300            # default: unload a model 5 min after its last request
logLevel: info
startPort: 9300           # ${PORT} auto-increments from here per model

# ── PRELOAD sift's retrieval serving path (2026-08-06) ─────────────────────────────
# ttl:0 on nemotron-rerank-1b means "never idle-evict", NOT "already loaded" — after a
# llama-swap restart or a config reload, a pinned model is still cold until something
# asks for it. Preload is what closes that gap.
#
# Why it is worth the startup cost: a vLLM cold start on this box is ~50s end-to-end
# (measured 2026-08-06 — container 14s, engine spawn 12s, weights 2.5s, torch.compile
# 1.9s WITH a warm ~/.cache/vllm, CUDA-graph capture 9s, profile+API ~9s). sift bounds
# rerank at 10s (RERANK_TOTAL_BUDGET), so a cold reranker does not error — the query
# silently degrades to fused-only ranking. Paying that once at stack boot, off the
# request path, is strictly better than letting a user's first search absorb it.
#
# All three are in the `sift-serve` matrix set, so co-residency is permitted and they
# will not swap each other out. ~11 GB held from boot (n 3.8 + m 4.7 + x 2.5).
#
# tei-sparse IS preloaded. Do not "optimise" it out on the strength of
# SIFT_SPARSE_ENABLED being unset in sift's .env: that env only seeds the NODE DEFAULT
# CONTRACT — the Contract an UNCONFIGURED pipeline inherits (sift-api/src/main.rs).
# Whether a query actually runs hybrid is decided PER PIPELINE by that pipeline's own
# sparse leg, and configured pipelines set sparse_enabled: true themselves (see
# sift config/pipeline.example.json). The env is not the switch it looks like.
# ── vLLM sleep-mode swapping (2026-08-06) ─────────────────────────────────────────
# `vllm-wrapper` is llama-swap's own helper (v243+, cmd/vllm-wrapper) for driving
# vLLM's /sleep + /wake_up from cmd/cmdStop instead of killing the container. It is
# NOT in the Arch package — build it when llama-swap is upgraded:
#   go build -o ~/bin/vllm-wrapper ./cmd/vllm-wrapper   # from the matching git tag
#
# A sleep-wired model runs its daemon on a FIXED port from the block below, outside
# llama-swap's ${PORT} pool, because the daemon must outlive the "stop". llama-swap
# still routes through ${PORT} — vllm-wrapper reverse-proxies onto the fixed port.
# Keep these out of the ${PORT} range (startPort 9300+) so they can never collide.
#
# Only wire models where sleep actually pays: the saving equals weights + KV cache,
# since the CUDA context and captured graphs deliberately stay resident. Big
# generative models win hugely; small pooling/embedding models do not (see the note
# on nemotron-rerank-1b).
macros:
  vllm_wrapper: /home/nullsense/bin/vllm-wrapper
  vllm_nanbeige_port: 8010
  vllm_nanbeige_sift_port: 8011

hooks:
  on_startup:
    preload:
      - nemotron-rerank-1b
      - nemotron-embed-1b
      - tei-sparse

models:
  # ── embeddings: sift + oracle. On-demand, evicts when idle (was ttl:0 always-on). ──
  octen-embedding-4b:
    cmd: env PORT=${PORT} /home/nullsense/bin/llm-servers/llama-octen
    proxy: http://127.0.0.1:${PORT}
    ttl: 300              # evict after 5 min idle (matches globalTTL); no longer pinned in VRAM
    name: "Octen-Embedding-4B (Q8_0)"
    aliases: [embed, octen-embed, qwen3-embedding-4b]
    description: "embedding · Octen-Embedding-4B (Qwen3-Embedding finetune), 2560-dim, last-token pooling. Shared embedder for sift + oracle."
    metadata: { engine: "llama.cpp", hf: "Octen/Octen-Embedding-4B", class: embedding, thinking: na, best_for: "semantic search / RAG / retrieval", tags: [embedding, local, shared] }

  # ── tool-search embedder — LFM2.5-Embedding-350M (1024-dim CLS), Vulkan GPU (~0.4 GB VRAM).
  #    Used by litellm mcp_semantic_tool_filter. Co-resident with the small models via the
  #    matrix (var `t`) so loading it NEVER evicts the chat model. First load auto-downloads
  #    the official llama.cpp GGUF (~379 MB Q8_0); needs a llama.cpp build with the `lfm2-bidir`
  #    arch (update llama.cpp if it errors "unknown architecture lfm2-bidir"; if the Vulkan
  #    backend lacks it, fall back to -ngl 0). Filter fails-open (all tools) if it can't load.
  lfm2-embed-350m:
    # ctx 8192 ≫ ubatch 512: -ub is the PER-INPUT token cap (pooled embeddings must fit one
    # ubatch); -c bounds the TOTAL tokens of a batched /v1/embeddings request. At -c 512 a
    # multi-input batch overflowed instantly ("Context size has been exceeded" — sift bulk
    # indexing, 2026-07-20). KV for 8k ctx on a 350M model is negligible VRAM.
    cmd: env PORT=${PORT} llama-server -hf LiquidAI/LFM2.5-Embedding-350M-GGUF:Q8_0 --embeddings --pooling cls --ctx-size 8192 --ubatch-size 512 --device CUDA0 -ngl 99 --host 127.0.0.1 --port ${PORT} --metrics
    proxy: http://127.0.0.1:${PORT}
    ttl: 3600
    name: "LFM2.5-Embedding-350M (tool search, CUDA GPU)"
    aliases: [embed-lfm, tool-embed, lfm2-embed]
    description: "embed·tools · LFM2.5-Embedding-350M 1024-dim CLS, CUDA GPU (~0.4 GB VRAM) — semantic MCP tool filter. Asymmetric query:/document: prefixes recommended."
    metadata: { engine: "llama.cpp", hf: "LiquidAI/LFM2.5-Embedding-350M-GGUF", class: embed, thinking: na, best_for: "MCP tool semantic search (litellm mcp_semantic_tool_filter)", tags: [embed, tools, local, lfm2, gpu, cuda] }

  # ── LEARNED-SPARSE (SPLADE-family) — sift's hybrid lexical leg (2026-07-31) ──────────────
  #    TEI is the only engine here that can serve SPLADE pooling: Infinity explicitly does
  #    not (michaelfeil/infinity#399), which is why this is its own entry and not another
  #    --model-id on the infinity image. `--pooling splade` is documented as working ONLY on
  #    "Bert and Distilbert MaskedLM architectures" — that constraint, not model quality, is
  #    what picked the model below.
  #
  #    MODEL: opensearch-neural-sparse-encoding-v2-distill — DistilBERT + MLM head, 67M,
  #    BEIR avg nDCG@10 0.528, Apache-2.0. That beats naver/splade-v3 (~0.520) at 60% the
  #    size. Stronger sparse models exist and were rejected on servability, not merit:
  #      doc-v3-gte  0.546, 8192 ctx — GTE arch, TEI cannot splade-pool it (needs a sidecar)
  #      LACONIC-1B  0.576 (BEIR14)  — Llama3 arch, same problem, and 15x the params
  #
  #    ⚠ SYMMETRIC — DO NOT swap in a `doc-`prefixed variant here. The `doc-*` models
  #    (doc-v2-distill, doc-v3-distill, doc-v3-gte) are INFERENCE-FREE: the model encodes
  #    documents only, and a query is a tokenizer + token→weight lookup table with no
  #    forward pass. Pointing this endpoint at one silently applies the DOCUMENT encoder to
  #    queries — off-distribution, no error, just quietly worse recall. Using one requires
  #    query-side lookup-table support in the client, which sift does not have.
  #
  #    CONSUMER: sift indexer + api via SparsePlan::Endpoint{format: Tei}. sift appends
  #    `/embed_sparse` itself (sift-indexer/src/silver/sparse_embedder.rs), so its base_url
  #    is llama-swap's per-model escape hatch — /embed_sparse carries no `model` field, so
  #    normal body-based routing cannot select this entry:
  #        http://127.0.0.1:9292/upstream/tei-sparse
  #
  #    5090 SIZING: the binding constraint is NOT the 67M of weights (~134 MB fp16) but the
  #    MLM logits tensor, which is [total_batch_tokens x 30522 vocab]. At 32768 batch tokens
  #    that is 32768*30522*2 B ≈ 2.0 GB of transient activation — raise --max-batch-tokens
  #    only with that multiplier in mind. --max-client-batch-size must stay >= sift's
  #    configured sparse batch_size or sift's batches get rejected at the door.
  #    --auto-truncate defaults to true (deliberately left default: sift chunks can exceed
  #    DistilBERT's 512 tokens, and truncating beats a 413).
  #    ⚠⚠ `--entrypoint text-embeddings-router` IS LOAD-BEARING — DO NOT REMOVE. ⚠⚠
  #    Without it the image runs its own /entrypoint.sh, which does:
  #        DRIVER_CUDA=$(nvidia-smi | awk '/CUDA Version/ {print $3; exit}')
  #    Our driver (610.43.03) prints "CUDA UMD Version: 13.3" — the newer nvidia-smi header
  #    format, which that regex does NOT match ("CUDA UMD Version" != "CUDA Version"). The
  #    parse yields empty, `${DRIVER_CUDA:-0.0.0}` makes it 0.0.0, the script concludes the
  #    host driver is ancient and prepends /usr/local/cuda/compat (libcuda 575.57.08) to
  #    LD_LIBRARY_PATH. CUDA forward-compat only works when the host driver is OLDER than
  #    the compat package; ours is NEWER, so libcuda 575 vs KMD 610 gives
  #    CUDA_ERROR_SYSTEM_DRIVER_MISMATCH (803).
  #    TEI then does NOT fail — it logs a WARN and silently falls back to
  #    "Starting DistilBert model on Cpu" + "forcing max_batch_requests=4", serving
  #    CORRECT results at a crawl. Nothing downstream errors; a bulk reindex just never
  #    finishes. Skipping the entrypoint uses the ldconfig-resolved host libcuda instead
  #    (/lib/libcuda.so.1 -> libcuda.so.610.43.03), which is what we want.
  #    VERIFY after any TEI bump — the log line must say Cuda, not Cpu:
  #        docker logs swap-tei-sparse 2>&1 | grep "Starting.*model on"
  #        want: "Starting FlashDistilBert model on Cuda(CudaDevice(DeviceId(1)))"
  #    Measured 2026-07-31: 2863 docs/s @ batch 128 on GPU. CPU path caps at batch 4.
  #    (Upstream added entrypoint.sh precisely to fix the CUDA 13.0+ compat break; the fix
  #     just doesn't survive this driver's nvidia-smi header. Recheck on a TEI upgrade —
  #     if their parser learns the new format, this override can go.)
  tei-sparse:
    cmd: >
      docker run --rm --name swap-tei-sparse --init --gpus all
      -p 127.0.0.1:${PORT}:80
      -v /home/nullsense/.cache/huggingface:/data
      --entrypoint text-embeddings-router
      ghcr.io/huggingface/text-embeddings-inference:120-1.9
      --model-id opensearch-project/opensearch-neural-sparse-encoding-v2-distill
      --pooling splade
      --dtype float16
      --max-batch-tokens 32768
      --max-client-batch-size 512
      --max-concurrent-requests 512
      --payload-limit 16000000
      --port 80
    cmdStop: docker stop -t 2 swap-tei-sparse
    proxy: http://127.0.0.1:${PORT}
    # Same reason as nemotron-embed-1b: llama-swap's internal default is 10 parallel
    # requests and #11 gets a 429. The sparse leg is embedded in the SAME Silver pass
    # as the dense leg, at the same concurrency, so it needs the same headroom.
    # TEI's own --max-concurrent-requests is 512, well above this.
    concurrencyLimit: 32
    # ttl:0 (PINNED) — 2026-08-06, was 3600, originally 300.
    # The 3600 was set because 300 was shorter than the gap between two search
    # sessions, so every return to work paid a cold load: measured 2026-08-03, an
    # idle-then-query cycle took 40-120s cold vs 42s warm and turned sift's own
    # ~1ms cache-warm search into ~10s or a 408 at the router's 30s ceiling.
    # Pinning removes the timer from the equation entirely. This entry is also in
    # hooks.on_startup.preload, so it is warm from boot rather than from first use.
    # Cheap to hold: ~2.5 GB peak, and the peak is MLM-logits activation, not weights.
    ttl: 0
    #
    # ⚠ 512-TOKEN INPUT CEILING — silent, and it is a TOKENIZER-MISMATCH problem.
    # Live `/info` (2026-08-06) reports max_input_length 512 with auto_truncate true.
    # 512 is the model's hard ceiling (DistilBERT position embeddings); no flag raises
    # it, and TEI truncates unconditionally — no error, nothing logged.
    #
    # How exposed we actually are: sift's live pipeline (sift_bronze pipeline id=1)
    # sets code/text/markdown_max_tokens ALL to 512, so it is not the gross
    # 768-into-512 overflow that sift's DEFAULT chunker targets (768 markdown /
    # 1024 code) would produce. But 512 is not 512 across tokenizers: sift chunks
    # with the Nemotron tokenizer (Mistral BPE) and TEI re-tokenizes with WordPiece
    # over a 30522 vocab, which generally yields MORE tokens for the same text. So
    # some chunks can still cross the line, and the sparse leg quietly loses their
    # tail while the dense leg (Nemotron, 4096) sees them whole.
    #   `--auto-truncate false` does NOT fix this; it converts silence into a hard
    #   rejection. Real fixes: measure the WordPiece length of real chunks and lower
    #   the chunk target to fit, or re-chunk the sparse leg at <=512 WordPiece tokens
    #   and max-pool the term weights. Both are retrieval-quality trades.
    # Re-check whenever the chunker's target tokens or the embedder's tokenizer change.
    #
    # BATCH-SIZE INVARIANT — 128 -> 512 on 2026-08-06. This was a LATENT BREAKAGE,
    # not a cosmetic disagreement: sift's docker-compose had already been moved to
    # 512 after a real failure ("batch size 134 > maximum allowed batch size 128"),
    # and this entry never got the fix. Anything routed here would have hit it again.
    #   --max-client-batch-size >= the largest request sift will actually send
    # Note the sizing rule that makes 128 too small: when transport.sparse.batch_size
    # is UNSET, sift sizes a sparse request by the DOCUMENT's chunk count, so a long
    # document alone can exceed 128. DEFAULT_SPARSE_HTTP_BATCH_SIZE = 12
    # (sift-indexer/src/silver/contract.rs) is the per-request default, not a cap on
    # this path — do not size this flag from that constant.
    # Nothing auto-syncs: sift reads only `model_id` from /info, never this field, so
    # the two definitions must be kept equal by hand. It is a pure request-validation
    # ceiling — GPU batching is governed by --max-batch-tokens, so a larger client
    # batch costs nothing until it lands.
    name: "OpenSearch neural-sparse v2-distill (TEI, SPLADE pooling)"
    aliases: [sparse, splade, sparse-embed, "opensearch-project/opensearch-neural-sparse-encoding-v2-distill"]
    description: "sparse · opensearch-neural-sparse-encoding-v2-distill 67M via TEI --pooling splade. BEIR 0.528 (> splade-v3 ~0.520 at 60% the size), 30522-dim over the BERT vocab, Apache-2.0. sift's hybrid lexical leg. Symmetric — queries run the model. ~2.5 GB peak."
    metadata: { engine: "TEI", hf: "opensearch-project/opensearch-neural-sparse-encoding-v2-distill", class: sparse, thinking: na, best_for: "sift hybrid retrieval sparse leg (learned lexical expansion)", tags: [sparse, splade, local, tei, opensearch, sift] }

  # ── Infinity models (michaelfeil/infinity — native uv project, ~/Programming/llm-stack/infinity) ──
  #    One llama-swap entry per model = independent on-demand load/evict. All API routes live under
  #    /v1 (--url-prefix /v1 → /v1/embeddings, /v1/rerank verified 2026-07-18); /health stays at ROOT,
  #    which is llama-swap's default probe — do not add a checkEndpoint. useModelName pins the upstream
  #    model field so every alias (incl. the raw HF repo ids legalkb sends) routes correctly.
  #    Batch sizes = the 2026-07-02 RTX 5090 benchmarks from the infinity mise.toml (embed 128 →
  #    254 texts/s; VRAM scales with batch×seq — post-Absatz legalkb chunks p99≈370 tok keep it sane).
  #    Consumers: legalkb (via :9292/v1) today; sift legalkb-tenant later (provider=custom,
  #    model=embed-legal, dimensions=2048, api_base=http://127.0.0.1:9292/v1 — 2048 ≠ octen's 2560,
  #    so it is a SEPARATE sift vector-config/collection by construction, never a swap-in).
  f2llm-embed:
    # CONTAINERIZED 2026-07-18 (image built from the project's own uv.lock — Modal-ready;
    # native venv remains the dev fallback: swap `docker run …` for
    # `.venv/bin/infinity_emb v2 --host 127.0.0.1 --port ${PORT} <same flags>`).
    # Score parity container↔native verified (bge 0.45535 both).
    cmd: docker run --rm -e PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True --name swap-f2llm --init --gpus all -p 127.0.0.1:${PORT}:7997 -v /home/nullsense/.cache/huggingface:/hf infinity-serving:local --engine torch --device cuda --dtype float16 --no-bettertransformer --model-id codefuse-ai/F2LLM-v2-1.7B --served-model-name f2llm-embed --batch-size 128 --url-prefix /v1
    cmdStop: docker stop swap-f2llm
    proxy: http://127.0.0.1:${PORT}
    useModelName: f2llm-embed
    ttl: 300
    name: "F2LLM-v2-1.7B (Infinity, 2048-dim)"
    aliases: [embed-legal, f2llm, "codefuse-ai/F2LLM-v2-1.7B"]
    description: "embedding · F2LLM-v2-1.7B fp16 2048-dim via Infinity — wins German legal retrieval (GerDaLIR/LeCaRDv2, see legalkb 2026-07-02 reeval). legalkb embedder now; sift legalkb-tenant embedding later. Batch 128 (5090: 254 texts/s)."
    metadata: { engine: "infinity", hf: "codefuse-ai/F2LLM-v2-1.7B", class: embedding, thinking: na, best_for: "German legal retrieval (legalkb; future sift legalkb tenant)", tags: [embedding, local, legal, infinity] }

  bge-rerank:
    cmd: docker run --rm -e PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True --name swap-bge --init --gpus all -p 127.0.0.1:${PORT}:7997 -v /home/nullsense/.cache/huggingface:/hf infinity-serving:local --engine torch --device cuda --dtype float16 --no-bettertransformer --model-id BAAI/bge-reranker-v2-m3 --served-model-name bge-rerank --batch-size 16 --url-prefix /v1
    cmdStop: docker stop swap-bge
    proxy: http://127.0.0.1:${PORT}
    useModelName: bge-rerank
    ttl: 300
    name: "bge-reranker-v2-m3 (Infinity)"
    aliases: [rerank, rerank-legal, "BAAI/bge-reranker-v2-m3"]
    description: "rerank · bge-reranker-v2-m3 cross-encoder via Infinity (/v1/rerank, sigmoid scores). legalkb reranker now; local reranker candidate for sift's RerankerService. ~1.3 GB."
    metadata: { engine: "infinity", hf: "BAAI/bge-reranker-v2-m3", class: rerank, thinking: na, best_for: "cross-encoder reranking (legalkb; sift local rerank later)", tags: [rerank, local, legal, infinity] }

  # ── Reranker fleet (2026-07-18) — four models, three backends, one contract (/v1/rerank) ──
  #    Default `rerank` alias stays on bge-rerank (cheapest, MIRACL-strongest). The others are
  #    opt-in tiers: rerank-strong (Qwen3-4B via llama.cpp — the 2026-07-02 legalkb merit pick,
  #    now servable since llama.cpp #15824), rerank-fast (jina-v3 listwise sidecar — BEIR SOTA
  #    at 0.6B), rerank-max (zerank-2 via the rerank sidecar — tops ELO boards; ⚠ CC-BY-NC
  #    weights, fine for personal use, NOT for commercial serving). Raw HF repo-ids are aliases so clients
  #    can pass them verbatim. A/B on German legal pairs before changing legalkb's registry.
  qwen3-reranker-4b:
    # ⚠ GGUF MUST be the official-converter build (Voodisss) — community conversions lack
    #   cls.output.weight → garbage 4.5e-23 scores (llama.cpp #16407). --reranking implies
    #   pooling=rank + embedding. -np 4 parallelizes doc scoring within /v1/rerank.
    # ctx 16384/np4 = 4k per rerank slot (query+doc pairs are short) + q8 KV — keeps the whole
    # process ~6 GB so it coexists in legal-q; 32k f16 KV (~9 GB total) OOM'd next to rewrite.
    cmd: env PORT=${PORT} llama-server --model /home/nullsense/.lmstudio/models/Voodisss/Qwen3-Reranker-4B-GGUF-llama_cpp/Qwen3-Reranker-4B.Q8_0.gguf --reranking --device CUDA0 -ngl 99 --ctx-size 32768 -np 4 --batch-size 8192 --ubatch-size 8192 --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0 --no-mmap --host 127.0.0.1 --port ${PORT} --metrics
    proxy: http://127.0.0.1:${PORT}
    ttl: 300
    name: "Qwen3-Reranker-4B (llama.cpp Q8_0)"
    aliases: [rerank-strong, "Qwen/Qwen3-Reranker-4B"]
    description: "rerank · Qwen3-Reranker-4B Q8_0 via llama.cpp native rerank (yes/no head). The legalkb 2026-07-02 merit pick, unblocked from infinity's ST pin. MTEB-R 69.76, MIRACL 67.52. ~4.3 GB."
    metadata: { engine: "llama.cpp", hf: "Qwen/Qwen3-Reranker-4B", class: rerank, thinking: na, best_for: "strong multilingual reranking (legalkb candidate; sift later)", tags: [rerank, local, qwen, llamacpp] }

  jina-reranker-v3:
    # Custom listwise arch (last-but-not-late, trust_remote_code) — not servable by infinity or
    # mainline llama.cpp (PR #22576 draft), so a minimal transformers sidecar speaks /v1/rerank.
    # Scores ≤64 docs in ONE forward pass (131K window) — fastest quality tier.
    cmd: docker run --rm -e PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True --name swap-jina --init --gpus all -p 127.0.0.1:${PORT}:7998 -v /home/nullsense/.cache/huggingface:/hf -e RERANK_BACKEND=jina -e SERVED_MODEL_NAME=jina-reranker-v3 rerank-sidecar:local
    cmdStop: docker stop swap-jina
    proxy: http://127.0.0.1:${PORT}
    ttl: 300
    name: "jina-reranker-v3 (listwise sidecar, bf16)"
    aliases: [rerank-fast, "jinaai/jina-reranker-v3"]
    description: "rerank · jina-reranker-v3 0.6B listwise (BEIR 61.94 — SOTA at size; 93 languages). Own sidecar (~/Programming/llm-stack/jina-reranker-v3). ~1.5 GB."
    metadata: { engine: "transformers-sidecar", hf: "jinaai/jina-reranker-v3", class: rerank, thinking: na, best_for: "low-latency SOTA reranking, ≤64 docs/pass", tags: [rerank, local, jina, listwise, sidecar] }

  zerank-2:
    # NOT servable by infinity after all (verified 2026-07-18): its ST config uses the
    # sentence-transformers 5.x module layout (`sentence_transformers.base`) — infinity's
    # ST<4.0 pin dies on import, the same signature that killed Qwen3-Reranker there.
    # Served from the rerank sidecar venv (modern ST 5.x + CrossEncoder trust_remote_code).
    # ⚠ CC-BY-NC-4.0 weights: personal/eval use only.
    cmd: docker run --rm -e PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True --name swap-zerank --init --gpus all -p 127.0.0.1:${PORT}:7998 -v /home/nullsense/.cache/huggingface:/hf -e RERANK_BACKEND=zerank -e SERVED_MODEL_NAME=zerank-2 -e RERANK_SLICE=2 rerank-sidecar:local
    cmdStop: docker stop swap-zerank
    proxy: http://127.0.0.1:${PORT}
    useModelName: zerank-2
    ttl: 300
    name: "zerank-2 (Infinity, CC-BY-NC)"
    aliases: [rerank-max, "zeroentropy/zerank-2-reranker"]
    description: "rerank · zerank-2 4B (Qwen3-4B base, zELO-trained — tops rerank ELO boards; strong on legal/finance). ⚠ CC-BY-NC: personal/eval only. ~8 GB fp16."
    metadata: { engine: "transformers-sidecar", hf: "zeroentropy/zerank-2-reranker", class: rerank, thinking: na, best_for: "max-accuracy reranking eval (legal/finance); non-commercial", tags: [rerank, local, zerank, infinity, nc-license] }

  # ── NVIDIA Nemotron retrieval pair (2026-07-22) — sift embed+rerank candidates on vLLM ──
  #    Both run on the v0.25.0 image (⚠ the NVFP4 embed checkpoint is BROKEN on v0.23.x/0.24.x
  #    per its card — do not downgrade the image). Wrappers own all tuning (CUDA-graph capture
  #    sizes, GPU_UTIL, trust-remote-code, the mandatory rerank score template).
  nemotron-embed-1b:
    cmd: env PORT=${PORT} /home/nullsense/bin/llm-servers/vllm-nemotron-embed
    cmdStop: docker stop -t 2 vllm-nemotron-embed
    proxy: http://127.0.0.1:${PORT}
    useModelName: nemotron-embed-1b
    # ⚠ MUST be set for any BULK-INDEXING model. llama-swap's INTERNAL default is 10
    # active parallel requests per model, and request 11+ gets an HTTP 429
    # {"error":"Too many requests"} — llama-swap's own error shape, not the upstream's.
    # Caught 2026-08-06 while moving sift's embedder off its standalone container:
    # a 12-way concurrent probe returned exactly 2x 429 and 10x 200. The standalone
    # :8100 container had no such ceiling, so this limit is introduced BY the move to
    # llama-swap — it is not a pre-existing condition.
    # sift's live SIFT_EMBEDDING_MAX_CONCURRENT is 4, so the default 10 does NOT break
    # anything today — this is a guard, not an active fix. It matters because that gate
    # is exactly the knob you reach for when tuning indexing: sift has been run at 16
    # before (performance-experiments.md 8g), and docs_in_flight caps at 8 here. Raising
    # it past 10 without this line would produce 429s that look like an indexer bug.
    # 32 leaves headroom for both.
    # llama-swap's docs say "recommended to be omitted" — that advice is written for
    # interactive chat, where 10 parallel requests is generous. It is wrong for a
    # bulk embedder.
    concurrencyLimit: 32
    # ttl:0 (was 300) — 2026-08-06. Completes the pinned sift serving trio with
    # nemotron-rerank-1b and tei-sparse. sift's keep-warm pings every 4 minutes, so a
    # 300s TTL never actually fired; pinning states the real behaviour.
    # ⚠ ttl:0 means "never unloaded for being IDLE". It does NOT exempt the model from
    # swap-engine eviction: loading a model that needs the VRAM (any big MoE, which is
    # in no matrix set and therefore runs solo) still evicts this one, and the next
    # search then pays a ~50s cold start. See the VRAM budget note on `matrix` below.
    ttl: 0
    name: "Nemotron-3-Embed-1B (vLLM NVFP4, 2048-dim)"
    aliases: [embed-nemotron, "nvidia/Nemotron-3-Embed-1B-NVFP4"]
    description: "embedding · Nemotron-3-Embed-1B NVFP4 (Ministral-3-3B pruned, avg pooling, 2048-dim Matryoshka) via vLLM. ⚠ /v1/embeddings callers MUST prefix 'query: '/'passage: '. 2048 ≠ octen's 2560 ⇒ separate sift collection. ~3.8 GB reserved."
    metadata: { engine: "vllm", hf: "nvidia/Nemotron-3-Embed-1B-NVFP4", class: embedding, thinking: na, best_for: "sift embed candidate (MTEB-strong, NVFP4-fast on Blackwell)", tags: [embedding, local, nvidia, vllm, nvfp4] }

  nemotron-rerank-1b:
    cmd: env PORT=${PORT} /home/nullsense/bin/llm-servers/vllm-nemotron-rerank
    cmdStop: docker stop vllm-nemotron-rerank
    proxy: http://127.0.0.1:${PORT}
    useModelName: nemotron-rerank-1b
    # Same reasoning as nemotron-embed-1b's limit, which this entry was missing
    # (added 2026-08-07). llama-swap's INTERNAL default is 10 active parallel
    # requests per model, and request 11+ gets an HTTP 429 {"error":"Too many
    # requests"} in llama-swap's OWN error shape — not vLLM's. On the rerank leg
    # that misreads badly: sift bounds rerank at 10s (RERANK_TOTAL_BUDGET) and
    # treats a failed rerank as a degrade to fused-only ranking, so a 429 storm
    # under bulk indexing surfaces as quietly worse results, exactly like the
    # cold-start case the ttl:0 note above describes — never as an error.
    # 32 matches the embed entry and leaves headroom above any candidate count
    # sift issues concurrently.
    concurrencyLimit: 32
    # ttl:0 = PINNED, never idle-evicted (2026-08-06). Was 3600.
    #
    # Why pinned rather than "a long TTL": sift-api's provider warm-up
    # (sift-api/src/services/warmup.rs) re-pings every provider every 4 minutes
    # by default, which is far shorter than any TTL we would set — so while sift
    # runs, this model never actually reached an idle unload anyway. The 4.7 GB
    # was already resident continuously; ttl:3600 only made that fact implicit
    # and made the residency depend on sift's keep-warm still being enabled.
    #
    # What the TTL was protecting against is real and unchanged: sift bounds
    # rerank at 10s (RERANK_TOTAL_BUDGET), and vLLM's cold start is ~49s
    # measured 2026-08-06 (container 14s + engine spawn 12s + weights 2.5s +
    # compile 1.9s cached + CUDA-graph capture 9s + profile/API ~9s). A cold
    # model therefore does NOT error — the query silently degrades to
    # fused-only ranking. The symptom is quietly worse results, not a failure,
    # which is exactly why this must not depend on a timer.
    ttl: 0
    name: "llama-nemotron-rerank-1b-v2 (vLLM bf16)"
    aliases: [rerank-nemotron, "nvidia/llama-nemotron-rerank-1b-v2"]
    description: "rerank · llama-nemotron-rerank-1b-v2 (Llama-3.2-1B bidirectional cross-encoder, avg pooling) via vLLM /v1/rerank. Score template + trust-remote-code enforced by the wrapper. 8k pairs. ~4.7 GB reserved."
    metadata: { engine: "vllm", hf: "nvidia/llama-nemotron-rerank-1b-v2", class: rerank, thinking: na, best_for: "sift rerank candidate (NVIDIA retrieval pair with nemotron-embed-1b)", tags: [rerank, local, nvidia, vllm] }

  # ── nanbeige4.2-3b: looped-transformer reasoner/agent (eval 2026-07-22) ────────────────
  #    NOT an E4B replacement for rewrite/summ: 96 tok/s BF16 batch-1 vs rewrite-E4B's 342
  #    (looped arch = 2× compute + 2× KV per token). Kept for RAG answer-gen / agentic
  #    experiments where its reasoning (GPQA 87.4, SWE-bench 63.6 @3B, thinking mode) wins.
  #    Arch is NOT upstream vLLM yet (PR #49433) — wrapper injects the vendored plugin
  #    (~/bin/llm-servers/vllm-plugins/nanbeige). Wrapper defaults: 64k ctx with fp8 KV
  #    (card wants 64k new tokens agentic / 128k reasoning; fp8 halves the looped arch's
  #    doubled KV), GPU_UTIL 0.48 (~15 GB: 7.9 weights + 5.5 KV@64k + graphs). 128k solo:
  #    MAXLEN=131072 GPU_UTIL=0.66. Sampling ships in generation_config (T=0.6 top_p .95
  #    top_k 20); the :agent alias forces the card's agentic T=1.0.
  nanbeige4.2-3b:
    # FP8-dynamic quant is the DEFAULT since 2026-07-22 (llmcompressor local checkpoint):
    # blind-judge gate passed (summ 4.55-vs-4.61 same judge, taxonomy 18/20 both) at +60%
    # decode (154 vs 96 tok/s freeform; 206 tok/s summarize with ngram spec) and 3 GB
    # less VRAM. Drop the MODEL env to fall back to the bf16 original.
    # EAGLE-3 draft head is the DEFAULT spec since 2026-07-23. THINKING-AWARE retrain
    # 2026-07-24 (28.6k corpus, 45% thinking traces, 4 epochs; val cond_acc 0.685/0.697/
    # 0.715, up from 0.622): thinking-mode acceptance 0.33->0.41 (+23%), thinking tok/s
    # 244->272; non-thinking gains too. Head lives at the same path (overwritten in place;
    # prior head backed up at ...EAGLE3.champion-bak). ONE config, keeps async+MRV2+full
    # graphs. TRITON_ATTN is mandatory with eagle3 on SM120 (FlashInfer+spec drops
    # cudagraphs to PIECEWISE, slower than spec-off). SPEC_TOKENS=3 (pos-2 accepts ~0.25).
    # Fall back: drop SPEC/SPEC_MODEL/ATTN envs → wrapper's ngram default.
    # Measured exception (2026-07-23 real-data sweep): LONG-document summarize
    # favors ngram (231 vs 160 output tok/s) — for bulk long-doc jobs run the
    # ngram config; eagle3 stays default for agent/RAG/chat/code traffic.
    # MAXLEN=131072 (128k) since 2026-07-26: Hermes requests max_tokens≈context_length,
    # so a 64k serve left 0 input room (max_tokens 65536 == full ctx). At 128k a 65536
    # hermes context_length leaves ~64k for input. GPU_UTIL 0.66 ≈ 21 GB reserved.
    # ── SLEEP-MODE SWAPPING (2026-08-06) ──────────────────────────────────────────
    # cmd/cmdStop go through `vllm-wrapper` (llama-swap v243+, PR #941; built from
    # cmd/vllm-wrapper — the Arch package ships only the main binary). Instead of
    # killing the container on evict, cmdStop calls POST /sleep?level=1 and the daemon
    # stays alive on ${vllm_nanbeige_port}; cmd health-checks it, wakes it, and only
    # cold-starts via --start-cmd when it is genuinely absent.
    #
    # Why this model above all others (measured 2026-08-06):
    #   awake 23.7 GB  ->  asleep 0.9 GB   = 22.7 GB released
    #   /sleep ~3 s      /wake_up 315 ms   vs an 82 s+ cold start
    # Sleep releases the cumem pool (weights + KV) and keeps the CUDA context and
    # captured graphs, which is exactly why the wake is sub-second. The payoff scales
    # with weights+KV, so it is enormous here (7.9 GB FP8 weights + ~14 GB KV @128k)
    # and NOT worth it for the retrieval trio (the reranker frees only 2.4 GB and sits
    # on sift's hot path) — those stay pinned and are deliberately not wired this way.
    #
    # --wait-timeout 10m: the default is 2m and a genuine cold start here has been
    # measured at 82 s to >4 min depending on page-cache state. Do not lower it.
    #
    # ⚠ TWO THINGS TO KNOW BEFORE TRUSTING THIS
    #
    # 1. STATE DESYNC. llama-swap tracks "running/stopped"; the daemon tracks
    #    "awake/asleep". They are separate. Calling /sleep or /wake_up directly on
    #    :8010 does NOT update llama-swap, and after that `POST /api/models/unload/
    #    nanbeige4.2-3b` did NOT put it back to sleep — the daemon sat AWAKE holding
    #    23.7 GB with llama-swap believing it had unloaded (observed 2026-08-06).
    #    Ground truth is always `curl :8010/is_sleeping`, never llama-swap's /running.
    #    If VRAM looks wrong, check that first and POST /sleep?level=1 to reclaim.
    #
    # 2. SLEEP ONLY FIXES THIS MODEL'S SIDE OF THE SWAP. Measured end-to-end:
    #      cold start (no daemon)                      69.8 s
    #      swap in from asleep                         41.6 s
    #      ...of which the raw wake is                  0.34 s
    #      ...and the first request after that          0.04 s
    #    So waking is effectively free; the 41 s is llama-swap tearing down the THREE
    #    retrieval models to make room (docker stop x3 + health-poll granularity).
    #    Sleep cannot fix that half. If you want the switch to be genuinely instant,
    #    the answer is to stop evicting at all — run nanbeige at MAXLEN=32768
    #    GPU_UTIL=0.40 (13.2 GB measured), which co-resides with the 13.2 GB trio
    #    inside the card with ~6 GB spare. 128k is what forces the eviction.
    cmd: >
      ${vllm_wrapper} serve
      --vllm-url http://127.0.0.1:${vllm_nanbeige_port}
      --listen :${PORT}
      --wait-timeout 10m
       --start-cmd "env PORT=${vllm_nanbeige_port} MODEL=/home/nullsense/.lmstudio/models/local/Nanbeige4.2-3B-FP8-Dynamic MAXLEN=32768 GPU_UTIL=0.45 SPEC=eagle3 SPEC_MODEL=/home/nullsense/.lmstudio/models/local/Nanbeige4.2-3B-EAGLE3 SPEC_TOKENS=3 ATTN=TRITON_ATTN /home/nullsense/bin/llm-servers/vllm-nanbeige"
    cmdStop: ${vllm_wrapper} sleep --vllm-url http://127.0.0.1:${vllm_nanbeige_port}
    proxy: http://127.0.0.1:${PORT}
    useModelName: nanbeige4.2-3b
    ttl: 300
    name: "Nanbeige4.2-3B (vLLM FP8-dynamic, looped)"
    aliases: [nanbeige, "Nanbeige/Nanbeige4.2-3B", "nanbeige4.2-3b:agent", "nanbeige4.2-3b:think", "nanbeige4.2-3b:fast"]
    description: "reason·agent·summarize · Nanbeige4.2-3B looped transformer (22L×2) FP8-dynamic + ngram spec on vLLM. Blind-judged summ winner vs E4B (see summ-eval-v2 caveat). 154 tok/s freeform. 128k fp8-KV, ~21 GB reserved. Thinking default ON — :fast for summ."
    metadata: { engine: "vllm", hf: "Nanbeige/Nanbeige4.2-3B", quant: "fp8-dynamic (local llmcompressor)", class: "reason·agent·summarize", thinking: "toggle (default on)", best_for: "RAG answer generation, agentic reasoning, high-coverage summarization (:fast); NOT rewrite (E4B faster+more robust)", tags: [reason, agent, summarize, local, nanbeige, vllm, fp8] }
    # Three card-mapped invocation profiles (card scenario table + preserve_thinking recs):
    #   :agent → tools/RAG/multi-turn agent — thinking ON, keep prior-turn reasoning,
    #            forced T=1.0 (card "Agentic and tool-use tasks")
    #   :think → hard QA/reasoning chat — thinking ON, drop prior-turn reasoning
    #            (card: preserve False for chat/QA), T=0.6 via generation_config
    #   :fast  → summarization/rewrite/plain chat — thinking OFF, T=0.6 via generation_config
    # Base id = template defaults (thinking ON, preserve ON), nothing forced.
    filters:
      setParamsByID:
        "nanbeige4.2-3b:agent":
          temperature: 1.0
          # 32k output ceiling: long CoTs routinely blow past 4-8k (measured: summ bench
          # 34/48 still mid-think at 4k). 32k out + 32k prompt fits the 64k slot.
          max_tokens: 32768
          chat_template_kwargs:
            enable_thinking: true
            preserve_thinking: true
        "nanbeige4.2-3b:think":
          max_tokens: 32768
          chat_template_kwargs:
            enable_thinking: true
            preserve_thinking: false
        "nanbeige4.2-3b:fast":
          chat_template_kwargs:
            enable_thinking: false
            preserve_thinking: false

  # ── nanbeige-sift: the SAME weights at 64k, sized to CO-RESIDE with retrieval ──────────
  #    A second entry rather than a smaller `nanbeige4.2-3b`, because the two consumers
  #    want incompatible things and only one of them can win per process:
  #      Hermes  → 128k, because it sends max_tokens ~= context_length (see the entry
  #                above); at 64k it has zero input room.
  #      Sift    → co-residency, because ONE grounded turn needs dense + sparse + rerank
  #                + a chat model all live. Evicting the retrieval trio per turn is what
  #                made a chat turn take 4m40s (measured 2026-08-06).
  #    Separate CONTAINER_NAME and PORT, so both can exist; the matrix decides which is
  #    resident, and they are in different sets so it never tries to hold both.
  #
  #    WHY 64k AND NOT 32k. Not throughput — max-model-len bounds ONE request, it does
  #    not set concurrency (the KV pool does). It is sift's synthesis prompt: the
  #    evidence bundle is capped at 96 KiB (~24k tokens) and arrives with chat history
  #    and a 16k output ceiling on top. 32k would truncate a full bundle; 64k does not.
  #
  #    EAGLE-3 IS ON HERE, and the reason is the quant, not the draft head. This block
  #    used to argue the opposite ("WHY NO EAGLE-3") from an FP8-dynamic weight budget
  #    where 64k + spec measured 20.1 GB and 20.1 + 12.3 (trio) left no headroom. The
  #    weights below are no longer those weights: NVFP4-FP8 LoopShield + GPU_UTIL 0.45
  #    holds 64k AND the draft head at 26.9/32.6 GB with the trio resident (measured
  #    2026-08-07). The old comment survived the weight swap and contradicted the
  #    `cmd:` three lines under it — SPEC=eagle3 has been set this whole time.
  #
  #    KV is fp8 (KV_DTYPE default in the run script) — that halving, from the looped
  #    arch's 176 KB/token, is what makes 64k fit at all. vLLM has no int4 KV path for
  #    this arch, so KV is as small as it goes.
  nanbeige-sift:
    cmd: >
      env PORT=${PORT}
      CONTAINER_NAME=vllm-nanbeige-sift
      SERVED_NAME=nanbeige-sift
      MODEL=/home/nullsense/.lmstudio/models/local/Nanbeige4.2-3B-NVFP4-FP8-LoopShield
      MAXLEN=32768
      GPU_UTIL=0.35
      SPEC=eagle3
      SPEC_MODEL=/home/nullsense/.lmstudio/models/local/Nanbeige4.2-3B-EAGLE3
      SPEC_TOKENS=3
      ATTN=TRITON_ATTN
      /home/nullsense/bin/llm-servers/vllm-nanbeige
    cmdStop: docker stop vllm-nanbeige-sift
    proxy: http://127.0.0.1:${PORT}
    useModelName: nanbeige-sift
    # ttl:0 (PINNED) — 2026-08-07, was 300. Completes the sift serving quartet:
    # the dense/sparse/rerank trio was pinned 2026-08-06 and this, the model that
    # PLANS the turn, was left idle-evicting behind them.
    #
    # Measured 2026-08-07 on this stack: a decompose call costs 2.3s warm and
    # 44.9s COLD (identical request, `reasoning_effort: "none"`, 80 completion
    # tokens either way — the whole 44.9s is model load). Sift's decompose
    # timeout is 8s, so every conversation resuming after an idle gap silently
    # lost its query planner and fell back to searching the raw question. No
    # timeout value fixes that: 8s cannot survive a cold start and 60s hangs the
    # user with no retrieval started. Residency is the fix.
    #
    # ⚠ As elsewhere: ttl:0 means "never unloaded for being IDLE". The matrix can
    # still evict it to satisfy a different set — see evict_costs below.
    ttl: 0
    aliases: [sift-nanbeige, sift-agent, sift-decompose]
    name: "Nanbeige4.2-3B · Sift 32k (co-resident, EAGLE-3)"
    description: "reason·agent·rag · NVFP4-FP8 LoopShield weights served at 32k with fp8 KV and an EAGLE-3 draft head, sized to fit beside sift's dense+sparse+rerank trio. For Sift's grounded chat turns; use nanbeige4.2-3b for longer-context reasoning."
    metadata: { engine: "vllm", hf: "Nanbeige/Nanbeige4.2-3B", quant: "nvfp4-fp8-loopshield", class: "reason·agent·rag", thinking: "toggle (default on; sift sends reasoning_effort explicitly)", best_for: "Sift grounded chat turns needing retrieval co-residency", tags: [reason, agent, rag, local, nanbeige, vllm, nvfp4, sift] }

  # ── thinking-toggle convention ─────────────────────────────────────────────────────────
  # Each reasoning-capable model exposes two extra aliases:
  #   <model-id>:think  →  forces thinking ON  (chat_template_kwargs.enable_thinking: true)
  #   <model-id>:fast   →  forces thinking OFF (chat_template_kwargs.enable_thinking: false)
  # Callers pick the alias; no body params needed. Verified schema: filters.setParamsByID,
  # PR #535 (mostlygeek/llama-swap v228+). Keys auto-register as aliases AND are listed
  # explicitly in aliases: for UI visibility. See docs/CAPABILITIES.md for the full table.
  # ──────────────────────────────────────────────────────────────────────────────────────

  # ── summarize: VRAM-ADAPTIVE summariser — diffusiongemma when there's room, else E4B ──
  # The `cmd` measures live free VRAM at load and execs the biggest summariser that fits
  # (diffusiongemma-26B vLLM ~22GB → gemma-4-E4B llama.cpp ~6GB → fail-to-cloud). Adapts to any
  # game automatically. SHORT ttl so an idle summariser evicts fast and re-checks VRAM next load.
  # cmdStop stops whichever backend it picked (docker container OR llama-server PID).
  summarize:
    cmd: env PORT=${PORT} /home/nullsense/bin/llm-servers/llama-summarize-auto
    cmdStop: /home/nullsense/bin/llm-servers/llama-summarize-stop ${PID}
    proxy: http://127.0.0.1:${PORT}
    useModelName: summarize   # both backends serve as "summarize"; pin the upstream name so the
                              # summarize-cheap alias (or any) doesn't 404 the vLLM served-model-name
    ttl: 120
    name: "Summarize (VRAM-adaptive: diffusiongemma ⟂ E4B)"
    aliases: [summarize-cheap]
    description: "summarize · picks diffusiongemma-26B (vLLM NVFP4, ~22GB, best quality+speed) when VRAM is free, else gemma-4-E4B (llama.cpp, ~6GB, game-friendly); fails so the caller falls back to cloud if neither fits. Thresholds env-overridable (SUMMARIZE_DIFF_MIN_MB / _E4B_MIN_MB); diffusion gpu-util derived from free VRAM."
    metadata: { engine: "vllm⟂llama.cpp", hf: "nvidia/diffusiongemma-26B-A4B-it-NVFP4 ⟂ google/gemma-4-E4B-it", class: summarize, thinking: "off", best_for: "VRAM-adaptive bulk summaries alongside gaming", tags: [summarize, adaptive, local, vllm, diffusion, gemma] }

  # ── summarization: cheap bulk model (direct E4B; also dictation rewrite / escalation) ──
  gemma-4-e4b:
    cmd: env PORT=${PORT} MODE=sum /home/nullsense/bin/llm-servers/llama-gemma4b
    proxy: http://127.0.0.1:${PORT}
    ttl: 300
    name: "Gemma-4 E4B-it (QAT UD-Q4_K_XL)"
    aliases: [gemma4-e4b, gemma-e4b, "gemma-4-e4b:think", "gemma-4-e4b:fast"]
    description: "summarize · Gemma-4 E4B QAT UD-Q4_K_XL — fast, faithful bulk summaries (0% fabrication on the oracle set), near-BF16 quality at 4.0GB. Thinking toggleable (default off). oracle's cheap-first summariser."
    metadata: { engine: "llama.cpp", hf: "google/gemma-4-E4B-it", class: summarize, thinking: "toggle (default off)", best_for: "faithful extractive summaries, instruction-following, dictation rewrite", tags: [summarize, instruct, local, gemma, faithful] }
    filters:
      setParamsByID:
        "gemma-4-e4b:think":
          chat_template_kwargs:
            enable_thinking: true
        "gemma-4-e4b:fast":
          chat_template_kwargs:
            enable_thinking: false

  gemma-4-12b-opus:
    cmd: env PORT=${PORT} /home/nullsense/bin/llm-servers/llama-gemma4
    proxy: http://127.0.0.1:${PORT}
    ttl: 300
    name: "Gemma-4 12B-it Claude-Opus-distill (Q4_K_M) + MTP"
    aliases: [summarize-strong, gemma4-12b, gemma-12b, gemma4-opus-distill, "gemma-4-12b-opus:think", "gemma-4-12b-opus:fast"]
    description: "summarize·reason · Gemma-4 12B Claude-Opus-distill + MTP — richer/analytical summaries, escalation target. Thinking toggleable (default on)."
    metadata: { engine: "llama.cpp", hf: "yuxinlu1/gemma-4-12B-it-Claude-4.6-4.8-Opus-GGUF", class: "summarize·reason", thinking: "toggle (default on)", best_for: "analytical summaries needing reasoning; escalation from summarize", tags: [summarize, reason, local, gemma, analytical] }
    filters:
      setParamsByID:
        "gemma-4-12b-opus:think":
          chat_template_kwargs:
            enable_thinking: true
        "gemma-4-12b-opus:fast":
          chat_template_kwargs:
            enable_thinking: false

  # ── shared rewrite + Sift RAG — vLLM E4B (NVFP4 W4A16 + MTP n=3) ────────────────────────
  #    llama-swap-managed on a DYNAMIC port (no more standalone fixed-:8001 container — that
  #    boot-racing service was retired 2026-07-20: it bound :8001 directly and the first
  #    dictation after boot raced its model load → "port 8001 has no rewrite model"). Now it's
  #    a normal llama-swap model: Gemma-4 E4B text-only NVFP4, serves `rewrite`, Sift's
  #    structured decomposition, and Sift's tool-using agent from one warm process. The
  #    64K limit does not create a second weight copy: vLLM's fixed GPU_UTIL reservation
  #    already owns the KV pool, and short rewrite calls use only the cache they need.
  #    Contract names hyprwhspr-ai dictation (backends.json), LiteLLM rewrite-fast,
  #    sift-decompose, and sift-agent all resolve here through llama-swap (:9292) /
  #    litellm (:4000), never a direct port. ttl:0 keeps it resident (dictation is latency-
  #    critical); the first request after boot loads it (~40s, and llama-swap queues the request
  #    through the load instead of erroring — which is what fixes the boot race).
  rewrite:
    # Use the checkpoint's own chat_template.jinja: it is Gemma-4 tool-capable and
    # preserves the text-only checkpoint's trained rewrite behavior. vLLM's generic
    # example tool template leaks planning text on ordinary no-tool requests here.
    # GPU_UTIL=0.42 OVERRIDES the script's 0.35 default. Measured 2026-08-07, after
    # `sift-agent` returned HTTP 500 for 79 s with the retrieval models resident.
    #
    # TWO separate vLLM checks have to pass, and 0.35 satisfies only the first once
    # anything else is on the card:
    #   1. util x 31.4 must be <= FREE memory at startup, else
    #        "Free memory on device cuda:0 (21.41/31.39 GiB) on startup is less than
    #         desired GPU memory utilization"
    #      (verified by overshooting to 0.78 = 24.5 GB against 21.4 GB free — the raise
    #       made it strictly worse, so this is not a "give it more" problem.)
    #   2. what is left after weights must still hold one full-length sequence, else
    #        "No available memory for the cache blocks."
    #      Weights here are 8.99 GB MEASURED (bf16 262k-vocab embeddings dominate despite
    #      NVFP4 linears — see the script's own note), and this cmd raises MAXLEN to
    #      65536, four times the script's 4096 default, so the KV floor is ~1.3 GB rather
    #      than the script's verified-alone margin.
    #
    #   0.42 x 31.4 = 13.2 GB:  <= free, and 13.2 - 9.0 = 4.2 GB KV, comfortably above
    #   the ~1.3 GB that 65536 tokens needs.
    #
    # 0.55 (17.3 GB) also WORKS and was verified first, but vLLM RESERVES the whole
    # fraction whether it needs it or not, so it left the card at 30.5/32.6 GB — 2.1 GB
    # free, under this page's own 4-8 GB floor and under what hyprwhspr dictation wants
    # transiently. Reserving less is the difference between "three models fit" and "three
    # models fit and dictation still works".
    #
    # This is the same failure already documented twice on this page (rag-nanbeige,
    # gemma-4-12b-opus, both "upstream command exited prematurely"): the matrix solver
    # schedules a combination it believes fits, but a util fraction verified on a QUIET
    # card does not survive co-residency. The script's 0.35 was verified alone.
    cmd: env PORT=${PORT} MAXLEN=65536 MAX_SEQS=2 GPU_UTIL=0.42 /home/nullsense/bin/llm-servers/vllm-gemma4b --enable-auto-tool-choice --tool-call-parser gemma4 --reasoning-parser gemma4
    cmdStop: docker stop vllm-gemma4b
    proxy: http://127.0.0.1:${PORT}
    useModelName: rewrite
    ttl: 0
    aliases: [sift-rag-e4b]
    name: "Shared E4B · Rewrite + Sift RAG (vLLM NVFP4 + MTP, 64K tools)"
    description: "rewrite·agent·rag · Gemma-4 E4B NVFP4 W4A16 + MTP n=3 on vLLM — resident 64K context, native Gemma-4 automatic tool calling and separated reasoning with the checkpoint template, structured output, and low-latency dictation cleanup from one physical slot."
    metadata: { engine: "vllm", hf: "principled-intelligence/gemma-4-E4B-it-text-only", class: "rewrite·agent·rag", thinking: "dynamic per request (default off; Sift agent on)", best_for: "dictation rewrite, Sift decomposition, and Sift agentic RAG", tags: [rewrite, dictation, agent, rag, tools, local, vllm, gemma, mtp, nvfp4] }

