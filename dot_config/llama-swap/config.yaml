  # ── GLiNER2 NER is ORACLE-OWNED, not in this stack (decided 2026-06-18). Oracle runs it
  #     in-process/sidecar with GLINER2_DEVICE=auto (GPU when a card is present, CPU fallback).
  #     It's not a llama.cpp/OpenAI-shaped model, so it doesn't belong behind llama-swap.

# ── VRAM coexistence (single 32 GB RTX 5090) ────────────────────────────────────────
# Default behavior (no matrix/groups): ONE model at a time — a request for model B
# unloads A. The `matrix` solver below instead keeps all small/medium models co-resident
# (32GB has the room) and lets only the big MoE models run solo. See the matrix block.
#
# ── matrix: solver-based concurrency (VALIDATED to parse on llama-swap v228, 2026-06-20) ──
# Semantics (docs/configuration.md): a model in NO set runs BY ITSELF (evicting all) —
# so every omitted big model keeps its current exclusive behavior, nothing breaks.
# `sets` is a MAPPING {name: DSL}; subset semantics = any subset of a set is a valid
# concurrent state. `evict_costs` = relative reload cost (higher → solver avoids
# evicting it). ⚠ llama-swap does NOT measure VRAM (maintainer: "users are responsible
# for resolving conflicts") — the set above is hand-estimated to fit 32 GB.
#
# CONFIRM headroom while the working set is loaded:
#       watch -n1 'nvidia-smi --query-gpu=memory.used --format=csv,noheader'
#   If it approaches ~31 GB, trim the `coresident` set. A timestamped backup of this
#   file is in this dir: config.yaml.bak-*  (restore = cp it back).
#
matrix:
  vars:
    e: octen-embedding-4b      # embeddings (sift + oracle) — keep warm
    s: gemma-4-e4b             # summarize  · NP=4 SPEC=off
    d: rewrite                 # shared E4B · rewrite + Sift RAG, 64K tools, ttl:0 (~11 GB)
    t: lfm2-embed-350m         # MCP tool-search embedder (~0.4 GB) — keep warm, never evict chat
    b: gemma-4-12b-opus        # strong summarizer/reasoner (~10 GB w/ MTP + 131k f16 KV)
    f: f2llm-embed             # Infinity F2LLM 2048-dim (legalkb / future sift legal tenant)
    r: bge-rerank              # Infinity bge-reranker-v2-m3 (~1.3 GB)
    q: qwen3-reranker-4b       # llama.cpp Q8_0 (~4.3 GB)
    j: jina-reranker-v3        # transformers sidecar (~1.5 GB bf16)
    z: zerank-2                # Infinity fp16 (~8 GB) — heavy
    n: nemotron-embed-1b       # vLLM NVFP4 2048-dim (~3.8 GB reserved) — sift candidate
    m: nemotron-rerank-1b      # vLLM bf16 cross-encoder (~4.7 GB reserved) — sift candidate
    a: nanbeige4.2-3b          # vLLM looped reasoner, 32k fp8-KV — 13.2 GB MEASURED (see budget)
    A: nanbeige-sift           # same weights @64k, no spec — sized to co-reside with n+m+x
    x: tei-sparse              # TEI SPLADE 67M (~2.5 GB peak: MLM logits, not weights)
    P: paddleocr-vl            # Documents OCR cascade, PRIMARY  — vLLM, GPU_UTIL 0.18 (~5.8 GB RESERVED)
    M: mineru                  # Documents OCR cascade, fallback 1 — vLLM, GPU_UTIL 0.25 (~8.0 GB RESERVED)
    G: glm-ocr                 # Documents OCR cascade, fallback 2 — vLLM, GPU_UTIL 0.15 (~4.8 GB RESERVED)
  # OCR evict costs are high for the same reason as x: the cost is reload-stalls per DOCUMENT,
  # not GB. A vault re-verify walks the cascade per scanned page; evicting mid-run re-pays a
  # full model load each time. vLLM gpu-memory-utilization is a FRACTION OF TOTAL (32 GB), so
  # the reservation exceeds the bf16 weights; P+M+G ≈ 18.6 GB reserved → the `ocr` set runs
  # solo-evicting (VRAM is the binding constraint, sift stack reloads after the OCR run).
  evict_costs: { A: 6, e: 10, s: 5, d: 7, t: 8, b: 6, f: 7, r: 6, q: 6, j: 5, z: 7, n: 7, m: 6, a: 4, x: 8, P: 8, M: 8, G: 7 }

  # ── MEASURED VRAM BUDGET, 2026-08-06 (nvidia-smi, not arithmetic) ─────────────────
  # Every other number on this page is a hand estimate. These three are not, and where
  # they disagree with the estimates the estimates were wrong — `a` was written down as
  # ~12.6-15 GB and actually held 20.1 GB at its old 64k default, which is what made
  # `rag-nanbeige` overcommit the card and fail to start with "upstream command exited
  # prematurely".
  #
  #   retrieval trio (n + m + x), all three resident   12.3 GB
  #   nanbeige @ MAXLEN 32768 / GPU_UTIL 0.40          13.2 GB
  #   ------------------------------------------------------
  #   full RAG stack                                   25.5 GB   of 32.6 GB
  #   leaves                                          ~7.1 GB   free
  #
  # That free figure is a DELIBERATE floor, not slack to be reclaimed: it absorbs
  # hyprwhspr dictation (~2.3 GB, comes and goes), the compositor, and vLLM's transient
  # profiling spike at load. Target 4-8 GB free. If a set pushes below ~4 GB, shrink a
  # model rather than trusting the estimate — llama-swap does NOT measure VRAM and will
  # happily schedule a combination that cannot start.
  #
  # nanbeige at its old 64k context does NOT fit next to the trio (20.1 + 12.3 = 32.4,
  # i.e. the whole card). Raising MAXLEN back to 65536 is a deliberate choice to evict
  # the retrieval models for an agentic run — see the header of vllm-nanbeige.
  sets:
    # 32GB 5090: keep all small/medium models hot together (any subset is a valid resident
    # state). Hand-estimated full-ctx f16-KV VRAM: embed 4.4 + e4b(s) ~5 + rewrite(vLLM E4B
    # NVFP4+MTP, util 0.35) ~11.15 + tool 0.4 + 12B ~10 ≈ 31GB, close to the 32GB ceiling —
    # watch headroom (see the CONFIRM note above) and trim GPU_UTIL further if it's tight.
    # Big MoE (qwen3.6-35b-a3b ~26GB, uncensored MXFP4 ~20GB) are in NO set → SOLO (evict all).
    coresident: "e & s & d & t & b"
    # legalkb working set: F2LLM embed + bge rerank must coexist (retrieval does embed→rerank
    # in one query), keep dictation (d, ttl:0) + tool-embed (t) alive. Query-time ≈ 17 GB;
    # legalkb BULK re-index observed ~16 GB for infinity alone → ~28 GB with d — watch
    # nvidia-smi during a re-index and drop INFINITY batch to 64 if it crowds 31 GB.
    # Deliberately excludes e/s/b: the solver evicts the summarizers + octen for legal work.
    # Light rerankers (r 1.3 + j 1.5) co-reside with embed; the heavy tiers get their own
    # sets so loading rerank-strong/-max evicts the light ones instead of OOMing:
    #   legal    ≈ f 3.5 + r 1.3 + j 1.5 + d 11 + t 0.4 ≈ 18 GB
    #   legal-q  ≈ f 3.5 + q 4.3 + d 11 + t 0.4         ≈ 19 GB
    #   legal-z  ≈ f 3.5 + z 8   + d 11 + t 0.4         ≈ 23 GB (watch during bulk runs)
    legal: "f & r & j & d & t"
    legal-q: "f & q & d & t"
    legal-z: "f & z & d & t"
    # sift HYBRID INDEXING working set (2026-07-31): dense + sparse must be co-resident,
    # because sift embeds every chunk on BOTH legs in the same Silver pass — if the
    # solver may evict one to load the other, a bulk reindex thrashes the pair once per
    # batch. That is also why x carries a high evict_cost (8) rather than a
    # small-model-cheap one: cost here is measured in reload-stalls per batch, not GB.
    #   e 4.4 + x 2.5 + d 11 + t 0.4 ≈ 18.3 GB
    # Sparse peak is activation, not weights, so it scales with --max-batch-tokens; if you
    # raise that, re-check this number rather than trusting the 2.5.
    #
    # NOTE (2026-08-06): `e` is octen (2560-dim), sift's CURRENT dense embedder for this
    # set. sift's .env now points its dense leg at `n` (nemotron, 2048-dim) instead, so
    # sift-nemotron-hybrid below is the set a re-index actually wants. Both are kept:
    # the two are NOT interchangeable (different dims ⇒ different collections), so which
    # one applies depends on the pipeline's vector-config, not on preference.
    sift-hybrid: "e & x & d & t"
    # Nemotron dense + sparse, the indexing counterpart to sift-serve.
    #   n 3.8 + x 2.5 + d 11 + t 0.4 ≈ 17.7 GB
    sift-nemotron-hybrid: "n & x & d & t"
    # sift SERVING working set. Without it, `sift-hybrid` (x, no m) and
    # `sift-nemotron` (m, no x) each evict the other's model and EVERY search pays a
    # full model load — measured at 26 s for a two-document rerank, which blows sift's
    # own request timeout and turns every query into a 408.
    #
    # UPDATED 2026-08-06: the dense embedder used to run as a standalone vLLM on :8100
    # that llama-swap knew nothing about, so `n` was deliberately NOT in this set — the
    # solver was budgeting around a model it could not see, and that container's ~2.9 GB
    # was invisible to every estimate on this page. sift now points at llama-swap
    # (SIFT_EMBEDDING_API_BASE=http://127.0.0.1:9292), so the dense leg is a real var
    # here and the query path's three models are finally all solver-visible.
    #   n 3.8 + x 2.5 + m 4.7 + d 11 + t 0.4 ~= 22.4 GB
    # m is ttl:0 (pinned) so it is resident regardless; listing it keeps the set honest.
    sift-serve: "n & x & m & d & t"
    # sift Nemotron working set: embed→rerank in one query path, plus dictation (d) +
    # tool-embed (t). n 3.8 + m 4.7 + d 11 + t 0.4 ≈ 20 GB. Octen (e) deliberately
    # excluded — a sift cutover to nemotron means a NEW 2048-dim collection; during
    # re-index keep an eye on nvidia-smi (vLLM reservations are fixed, so no surprise
    # growth like infinity's batch-scaled peaks).
    sift-nemotron: "n & m & d & t"
    # sift CHAT working set — the one a grounded turn actually needs. A turn is
    # decompose -> dense+sparse retrieval -> cross-encoder rerank -> synthesis, so the
    # chat model and all three retrieval legs must be resident TOGETHER or the turn pays
    # a model load per stage (measured 4m40s and a bare 408 before this set existed).
    #   A 14.4 + n 3.8 + x 2.5 + m 4.7 ~= 25.4 GB, leaving ~7 GB — the same shape as the
    #   "full RAG stack" budget above, with the 64k no-spec variant standing in for `a`.
    # `d` is deliberately NOT here: rewrite is 11 GB and would push this over the card.
    # Sift can use either chat model — `A` for quality, `d` (sift-agent) when dictation
    # must stay hot — but not both at once.
    sift-chat: "A & n & x & m"
    # Documents-vault OCR cascade (2026-08-11, migrated GGUF→vLLM docker). Before the set existed
    # the three OCR VLMs ran SOLO and evicted the previous one — engines.py walks primary ->
    # fallback -> fallback WITHIN A SINGLE DOCUMENT whenever numeric agreement is low, so a scanned
    # doc could pay three full model loads, and the next doc paid them again. Now they co-reside.
    #   P ~5.8 + M ~8.0 + G ~4.8 + t 0.4 ~= 19.0 GB RESERVED (gpu-memory-utilization of 32 GB total,
    #   vLLM reserves ahead even for small weights). The sift stack is NOT in this set: 19 GB +
    #   sift trio (12.3 GB) would exceed the card, so an OCR run evicts sift and reloads it after.
    #
    # `d` (rewrite, 11 GB) is DELIBERATELY EXCLUDED, unlike most sets here. The Documents
    # pipeline runs its own in-process PP-OCRv6/PP-StructureV3 on the SAME card via
    # paddlepaddle-gpu (~2 GB, observed during a run) and llama-swap cannot see that
    # allocation — the identical blind spot that made the old standalone vLLM on :8100 corrupt
    # every estimate on this page. Adding d would push the visible total over budget and the
    # true total to ~27 GB, betting the OCR run on an invisible 2 GB. Dictation reloads
    # after a vault run; a failed OCR cascade silently degrades legal documents.
    ocr: "P & M & G & t"
    # ⚠ REMOVED 2026-08-06: `rag-nanbeige: "a & n & m & t"` was IMPOSSIBLE and this set
    # existing is what made every nanbeige start fail with "upstream command exited
    # prematurely" while the retrieval models were resident. The solver believed the
    # combination fit, so it evicted only tei-sparse, left n+m up, and handed nanbeige
    # a card that could not satisfy it. vLLM's own error is unambiguous:
    #   ValueError: Free memory on device cuda:0 (18.75/31.39 GiB) on startup is less
    #   than desired GPU memory utilization (0.66, 20.72 GiB)
    #
    # MEASURED, not estimated:
    #   nanbeige alone, as llama-swap actually launches it
    #   (cmd pins MAXLEN=131072 GPU_UTIL=0.66 — those OVERRIDE the wrapper defaults,
    #    so tuning vllm-nanbeige's defaults does nothing for this path)   23.7 GB
    #   retrieval trio (n + m + x)                                        13.2 GB
    #   -------------------------------------------------------------------------
    #   together                                                          36.9 GB  > 32.6
    # The old comment's "a 15" was wrong by ~9 GB.
    #
    # nanbeige is therefore in NO set: it runs SOLO, evicting everything, which is the
    # correct and honest behaviour for a model that wants 2/3 of the card. If you want
    # it co-resident with retrieval, drop its context — at MAXLEN=32768 GPU_UTIL=0.40 it
    # measures 13.2 GB and 13.2 + 13.2 = 26.4 GB fits with ~6 GB spare. That is a
    # capability trade: 128k exists because Hermes sends max_tokens ~= context_length,
    # and a 64k serve left no input room (see the cmd's own comment).
    #
    # SLEEP MODE is the better answer here and is already enabled on the wrapper.
    # Measured 2026-08-06: POST /sleep?level=1 on nanbeige released 22.7 GB (29.2 -> 6.4
    # GB total; a sleeping nanbeige holds only ~0.9 GB of context+graphs) and /wake_up
    # restored it in 315 ms, serving correctly afterwards. Driving that from llama-swap
    # needs cmd/cmdStop pointed at `vllm-wrapper` (shipped in llama-swap v243+, built
    # separately from cmd/vllm-wrapper) rather than at the run script directly.
#
# Why matrix over legacy `groups`: groups force all-or-nothing exclusive unloads; the
# matrix solver evicts the FEWEST/cheapest models to satisfy a request. (groups still
# work; a config uses matrix OR groups, not both.) On 32 GB the common working set
# (embed + both E4B instances + tool-embed + 12B) is all hot at once — what the old
# 12 GB box could never do.
