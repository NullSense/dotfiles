[Unit]
After=agent-vault.service
Wants=agent-vault.service

[Service]
# Keep Hermes's generated base unit vendor-owned. This drop-in is the durable
# credential boundary and survives `hermes gateway` refreshing the base unit.
LoadCredentialEncrypted=hermes-agent-vault-token:%h/.config/credstore.encrypted/hermes-agent-vault-token.cred
LoadCredentialEncrypted=hermes-hass-token:%h/.config/credstore.encrypted/hermes-hass-token.cred
LoadCredentialEncrypted=hermes-litellm-key:%h/.config/credstore.encrypted/hermes-litellm-key.cred
Environment="AGENT_VAULT_ADDR=http://127.0.0.1:14321"
Environment="AGENT_VAULT_VAULT=hermes"
ExecStart=
ExecStart=/bin/sh -c 'export AGENT_VAULT_TOKEN="$(cat "$CREDENTIALS_DIRECTORY/hermes-agent-vault-token")"; export HASS_TOKEN="$(cat "$CREDENTIALS_DIRECTORY/hermes-hass-token")"; export LITELLM_MASTER_KEY="$(cat "$CREDENTIALS_DIRECTORY/hermes-litellm-key")"; export HINDSIGHT_LLM_API_KEY="$LITELLM_MASTER_KEY"; exec /usr/local/bin/agent-vault run -- /home/nullsense/.hermes/hermes-agent/venv/bin/python -m hermes_cli.main gateway run'
