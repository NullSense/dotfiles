# Prefer native Wayland so apps can render for each output scale.
# XWayland uses force_zero_scaling in Hyprland; legacy apps may need
# app-specific sizing. Fractional-scale quality depends on client support.

GDK_BACKEND=wayland,x11
QT_QPA_PLATFORM=wayland;xcb
# Use compositor borders instead of Qt client-side decorations.
QT_WAYLAND_DISABLE_WINDOWDECORATION=1
# Keep Qt automatic scaling consistent with hypr/env.conf.
# Do not set a global QT_SCALE_FACTOR or GDK_SCALE for mixed-DPI outputs.
QT_AUTO_SCREEN_SCALE_FACTOR=1
MOZ_ENABLE_WAYLAND=1
ELECTRON_OZONE_PLATFORM_HINT=auto
SDL_VIDEODRIVER=wayland,x11
# SDL3 renamed the var and ignores SDL_VIDEODRIVER — without this, SDL3 games
# (CS2 etc.) silently fall back to Xwayland, which tears on NVIDIA while the
# compositor stays vsynced. SCALE_TO_DISPLAY makes SDL3-Wayland games see the
# native mode (3840x2160) instead of the scale-2.0 logical 1920x1080.
SDL_VIDEO_DRIVER=wayland,x11
SDL_VIDEO_WAYLAND_SCALE_TO_DISPLAY=1
CLUTTER_BACKEND=wayland
BEMENU_BACKEND=wayland
_JAVA_AWT_WM_NONREPARENTING=1
NIXOS_OZONE_WL=1

# Cursor — read by X11/XWayland apps and some Qt/GTK paths that don't go
# through gsettings. 32 looks right on 32" 4K @ 1.5× scale; bump to 40 for
# a chunkier feel.
XCURSOR_THEME=Adwaita
XCURSOR_SIZE=24
