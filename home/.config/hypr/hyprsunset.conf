# Per-output night color managed by hyprsunset's Hyprland CTM protocol.
# The daemon applies each profile to every connected and newly hot-plugged
# monitor. Identity is the unfiltered daytime state; gamma stays untouched.

max-gamma = 100

profile {
    time = 06:00
    temperature = 6500
    gamma = 1.0
    identity = true
}

profile {
    time = 19:00
    temperature = 4000
    gamma = 1.0
}
