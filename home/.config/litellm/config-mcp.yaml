# litellm MCP-ENABLED instance (:4001) — OPTIONAL profile, started by `stack mcp`.
# Everything the gateway (config.yaml :4000) has, PLUS mcp_servers aggregation and the
# (deliberately disabled — see comment) semantic tool filter. Remote tool mapping
# and failure handling have a different lifecycle, so this remains separate from
# the always-on model gateway even though LiteLLM 1.97 binds before mapping finishes.
# Consumers connect directly to http://127.0.0.1:4001/mcp/ (trailing slash).
# This instance is unauthenticated and MUST remain bound to loopback; local clients
# already have the same authority to launch these MCP processes themselves.
# Shares litellm-db with the model gateway, but MCP servers live in THIS
# FILE only; the DB mcp_servers row was purged 2026-07-22 (it was a stale duplicate
# that made even the plain gateway run tool discovery at boot).

include:
  - models.yaml

mcp_servers:
  legalkb_dev_memory:
    description: 'LegalKB development. Fixed scope: pipeline/. Engineering decisions
      only; never private case contents. Derived memory: verify cited sources; errors
      or empty results do not prove absence.'
    allow_all_keys: true
    transport: http
    url: http://127.0.0.1:9178/mcp/legalkb-dev/
    allowed_tools:
    - retain
    - recall
    - reflect
    - search_knowledge_base
    - list_mental_models
    - get_mental_model
    - list_documents
    - get_document
    - list_operations
    - get_operation
    - list_tags
    - get_bank
    - list_directives
    timeout: 660
    access_groups:
    - dev
    - research
  matas_case_memory:
    description: 'Private documents — Matas Peciukonis. Fixed scope: Matas_Peciukonis/.
      Only this person''s documents and case history; never another person''s case.
      Derived memory: verify cited sources; errors or empty results do not prove absence.'
    allow_all_keys: true
    transport: http
    url: http://127.0.0.1:9178/mcp/documents-matas-peciukonis/
    allowed_tools:
    - recall
    - reflect
    - search_knowledge_base
    - list_mental_models
    - get_mental_model
    - list_documents
    - get_document
    - list_operations
    - get_operation
    - list_tags
    - get_bank
    - list_directives
    timeout: 660
    access_groups:
    - dev
    - research
  pieter_case_memory:
    description: 'Private documents — Pieter Hoevers. Fixed scope: Pieter_Hoevers/.
      Only this person''s documents and case history; never another person''s case.
      Derived memory: verify cited sources; errors or empty results do not prove absence.'
    allow_all_keys: true
    transport: http
    url: http://127.0.0.1:9178/mcp/documents-pieter-hoevers/
    allowed_tools:
    - recall
    - reflect
    - search_knowledge_base
    - list_mental_models
    - get_mental_model
    - list_documents
    - get_document
    - list_operations
    - get_operation
    - list_tags
    - get_bank
    - list_directives
    timeout: 660
    access_groups:
    - dev
    - research

  exa:
    description: "Exa — neural web and code search (research)."
    allow_all_keys: true
    transport: http
    url: "https://mcp.exa.ai/mcp"
    access_groups: ["research"]
  parallel:
    description: "Parallel Search — AI-powered web search and token-efficient markdown extraction (research)."
    # Anonymous free tier, so NO credential belongs in this public repository.
    # The `/mcp` endpoint is free at lower rate limits; `/mcp-oauth` requires a
    # Parallel account. The `parallel-cli` on this box is already OAuth-authenticated
    # against the Tensil org and is the higher-limit path — this entry is the
    # gateway-reachable option, not a replacement for the CLI.
    # Search settings (mode, domains, locale) are pinned as URL query parameters;
    # left unset here so the server picks `fast` with managed defaults, which is
    # what the anonymous tier serves regardless.
    allow_all_keys: true
    transport: http
    url: "https://search.parallel.ai/mcp"
    access_groups: ["research"]
    allowed_tools:
      - web_search
      - web_fetch
  context7:
    description: "Context7 — current library and framework documentation (dev, research)."
    allow_all_keys: true
    transport: http
    url: "https://mcp.context7.com/mcp"
    access_groups: ["dev", "research"]
  sift:
    description: "Sift — local tenant-scoped semantic retrieval and source discovery (dev)."
    # Local auth-off development endpoint. The gateway remains loopback-only;
    # callers use the gateway rather than connecting to Sift directly.
    allow_all_keys: true
    transport: http
    url: "http://127.0.0.1:8788/mcp"
    access_groups: ["dev"]
  wikipedia:
    description: "Wikipedia — article and revision search/read access through MediaWiki (research)."
    # Wikipedia and Wikidata are complementary: this server reads encyclopedia
    # articles; Wikidata below queries structured entities and relationships.
    # Pin npx so a service restart cannot silently execute a newly published build.
    # The older wikipedia-mcp 2.0.1 client receives Wikimedia 429s from Python
    # requests on this host even while the API itself is healthy; the maintained
    # MediaWiki server uses the current API path and defaults to English Wikipedia.
    allow_all_keys: true
    access_groups: ["research"]
    transport: stdio
    command: npx
    args: ["-y", "@professional-wiki/mediawiki-mcp-server@0.17.0"]
    env:
      MCP_LOG_LEVEL: "warning"
      MCP_CONTENT_MAX_BYTES: "50000"
    # Anonymous Wikipedia must remain read-only even if upstream later changes
    # which unauthenticated tools it advertises.
    allowed_tools:
      - compare-pages
      - get-category-members
      - get-file
      - get-links-here
      - get-page
      - get-page-history
      - get-pages
      - get-recent-changes
      - get-revision
      - get-site-info
      - parse-wikitext
      - search-page
      - search-page-by-prefix
  wikidata:
    description: "Wikidata — SPARQL plus entity and vector search, hosted public (research)."
    # Official WMDE Wikidata MCP — HOSTED, HTTP, fully public (no auth → nothing to shield),
    # so litellm connects directly. Backs onto query.wikidata.org SPARQL + wikidata API +
    # WMDE vector search (all server-side). Self-host later via github.com/wmde/WikidataMCP.
    url: "https://wd-mcp.wmcloud.org/mcp/"
    access_groups: ["research"]
    transport: "http"
    allow_all_keys: true
  mdn:
    description: "MDN — web-platform docs and browser-compat/baseline data (dev, research)."
    # MDN (Mozilla) MCP — HOSTED, HTTP, public (no auth → nothing to shield). Up-to-date
    # web-platform docs + browser-compat/baseline data. litellm connects directly. Experimental.
    url: "https://mcp.mdn.mozilla.net/"
    access_groups: ["dev", "research"]
    transport: "http"
    allow_all_keys: true
  firecrawl:
    description: "Firecrawl — web search plus JS-rendered page scraping (research)."
    # Keyless by design: verified 2026-08-28 against mcp.firecrawl.dev/v2/mcp, which
    # returns serverInfo firecrawl-fastmcp 3.24.1 on an initialize with NO Authorization
    # header. ~1,000 free credits/month before it wants an own key, so there is no
    # credential to keep out of this public repo. Complements exa rather than
    # duplicating it: exa is neural search over an index, firecrawl fetches and renders
    # a specific page, which is what actually breaks on JS-heavy vendor docs.
    url: "https://mcp.firecrawl.dev/v2/mcp"
    access_groups: ["research"]
    transport: "http"
    allow_all_keys: true
    # firecrawl_parse is withheld deliberately. The keyless session advertises it, but it
    # "processes supported local files through its two-phase upload flow" — i.e. it uploads
    # local file content to a third party. Search and scrape only ever send a query or a URL.
    allowed_tools:
      - firecrawl_search
      - firecrawl_scrape
  alphaxiv:
    description: "alphaXiv — arXiv research-paper search, full-text read and PDF analysis (research)."
    # Endpoint and auth verified 2026-09-11 against https://www.alphaxiv.org/docs/mcp and by
    # probing the endpoint directly: an unauthenticated initialize returns
    #   401 + www-authenticate: Bearer realm="mcp", authorization_uri="https://api.alphaxiv.org/auth"
    # so this server is NOT keyless, unlike every other hosted entry above. It advertises
    # OAuth 2.1 for interactive clients; a headless service like this gateway must use the
    # API-key path instead ("Settings > API Keys" on alphaxiv.org, sent as Authorization: Bearer).
    #
    # The key therefore does NOT belong in this file — this repository is public. It is injected
    # by the Agent Vault transparent proxy that `~/bin/llm-servers/litellm-mcp` already exports
    # HTTPS_PROXY for, exactly as the comment there describes ("LiteLLM itself owns the hosted MCP
    # connections. Route those through Agent Vault so credentials are injected without appearing
    # in this config"). Required one-time setup, run by a human:
    #   agent-vault vault service add --vault default --name alphaxiv \
    #     --host api.alphaxiv.org --auth-type bearer --token-key ALPHAXIV_API_KEY
    #   # then store the key itself in the vault's credential store under ALPHAXIV_API_KEY
    # Until that exists every tool call returns upstream 401; the gateway still boots, so leaving
    # this registered is safe (same tolerance as the legalkb entry below).
    #
    # Note the direct probe also returns Cloudflare 1010 for non-browser user agents — python
    # urllib is banned by browser signature while curl with a normal UA is not. If tool calls fail
    # with 403/error_code 1010 rather than 401, that is the UA filter, not the credential.
    allow_all_keys: true
    transport: http
    url: "https://api.alphaxiv.org/mcp/v1"
    access_groups: ["research"]
  legalkb:
    description: "LegalKB — local German statute, administrative guidance and court-decision corpus (research)."
    # Local and offline. This stdio entry is a thin wrapper that talks to a loopback HTTP
    # server on :8077, which must already be running (`python -m legalkb serve` in the owning
    # checkout). When that server is down the individual tool calls error; the gateway still
    # boots, which is why leaving this registered permanently is safe.
    # Pinned to an absolute script path on purpose: `uv run --script` resolves the PEP 723
    # header, so the entry does not depend on the gateway's working directory or on the
    # project venv being activated.
    allow_all_keys: true
    access_groups: ["research"]
    transport: stdio
    command: uv
    args: ["run", "--script", "/home/nullsense/Documents/pipeline/legalkb/mcp_server.py"]
    # legalkb_documents is withheld deliberately, in the same spirit as firecrawl_parse above.
    # The three tools below read the published legal corpus and take a query or an id. That
    # fourth one reads the operator's own private document store and applies no per-subject
    # scoping of its own, so a caller reaching it through this shared gateway can receive
    # records it never asked for. It stays available to the owning project, which registers
    # this server directly and knows what it is asking for.
    allowed_tools:
      - legalkb_search
      - legalkb_show
      - legalkb_navigate
    # STATUS 2026-09-08 — this entry is CORRECT but this gateway build DENIES it. A tools/list
    # scoped with `x-mcp-servers: legalkb` returns
    #   {"legalkb":{"status":"forbidden","http_status":403}}, tools: []
    # and legalkb is absent from the unscoped listing. What that is NOT, each ruled out by test:
    #   - not a spawn failure. Driven by hand under this service's exact environment (proxy vars
    #     included), the server initializes, advertises its tools and answers a real tools/call
    #     against 127.0.0.1:8077 with HTTP 200.
    #   - not `access_groups`  — removed, restarted, still 403.
    #   - not `allowed_tools`  — removed, restarted, still 403.
    #   - not an unknown name  — an invented server name returns NO outcome entry at all, whereas
    #     this one gets an explicit denial, so the gateway does read this block.
    # litellm classifies `forbidden` only from an upstream 401/403 (MCPUpstreamAuthError), a path
    # that presupposes an HTTP upstream a stdio server does not have — so the denial is coming from
    # the gateway's own permission layer, most likely because a newly added server has no row in
    # litellm-db while `store_model_in_db: false` and the master key is unset. Not yet isolated.
    # Until it is, reach legalkb by registering this same command directly with the MCP client.
  # Personal Hindsight memory is intentionally absent here. Hermes owns it
  # through the native memory provider, so general MCP clients cannot read or
  # retain into the personal bank. Non-personal banks need a separate,
  # explicitly scoped endpoint rather than this shared gateway.

litellm_settings:
  # Task prompts (dotprompt): summarize/rewrite/extract → config/prompts/<id>.prompt.
  # Global dir form (NOT per-prompt prompt_directory, which crashes boot). Reference via prompt_id.
  global_prompt_directory: "/home/nullsense/Programming/llm-stack/config/prompts"
  # LiteLLM 1.97.0's OTEL callback assumes MCP responses are dict-like; valid
  # list/CallToolResult responses therefore log AttributeError after successful
  # tool calls. Keep OTEL on the :4000 model gateway, but disable it here until
  # the MCP response handler is fixed upstream.
  callbacks: []
  num_retries: 2
  request_timeout: 600          # local models + cold-swap loads can be slow
  drop_params: true             # tolerate clients sending params a backend doesn't support
  # Failure-fallback at the gateway (oracle also gates in-app): a failed/unreachable
  # summarize-cheap (local Gemma E4B in dev) fails over FIRST to DeepSeek-v4-flash
  # cloud (env-independent), then to summarize-strong as a last resort.
  fallbacks: ["summarize-cheap": ["summarize-fallback", "summarize-strong"]]

  # ── EXACT response cache (safe: byte-identical request → identical answer). NOT
  #    semantic — semantic carries a 3-8% wrong-answer false-hit rate, unacceptable for
  #    unique-article summaries. disk backend = zero new service. mode default_off =
  #    opt-in: a request caches only when it sends `cache: {"no-cache": false}`. ──────
  cache: true
  cache_params:
    type: disk
    disk_cache_dir: "/home/nullsense/.cache/llm-stack/litellm-cache"  # FIXED path — default is CWD-relative (./.litellm_cache), which leaks into whatever dir launched the proxy
    mode: default_off

  # ── Model Hub (/ui/model_hub_table) — advertise HF-identity names publicly ──────
  #    Intent routes (summarize-cheap/strong, oracle-llm) kept for backwards compat.
  #    Bench-only quant variants (e4b-q4/q8) intentionally omitted.
  public_model_groups: ["embed", "summarize-cheap", "summarize-strong", "oracle-llm", "google/gemma-4-E4B-it", "yuxinlu1/gemma-4-12B-it-Claude-4.6-4.8-Opus-GGUF", "LiquidAI/LFM2-1.2B-Extract", "LiquidAI/LFM2-2.6B", "LuffyTheFox/Qwen3.6-35B-A3B-Uncensored", "ibm-granite/granite-vision-3.3-2b", "datalab-to/chandra-ocr-2", "anthropic/claude-sonnet-5", "rewrite-fast", "sift-decompose", "sift-agent", "yuxinlu1/gemma-4-12B-it-Claude-4.6-4.8-Opus-GGUF:think", "yuxinlu1/gemma-4-12B-it-Claude-4.6-4.8-Opus-GGUF:fast", "google/gemma-4-E4B-it:think", "google/gemma-4-E4B-it:fast", "LuffyTheFox/Qwen3.6-35B-A3B-Uncensored:think", "LuffyTheFox/Qwen3.6-35B-A3B-Uncensored:fast"]
  # Disabled: LiteLLM <=1.93 applies this global MCP index to ordinary client-defined
  # OpenAI tools too. A match against an unrelated MCP name then replaces an app's tools
  # with an empty array (observed with Sift's six search tools), so this is not fail-open.
  # Keep all caller-provided tools until request-time tool indexing lands in a release.
  mcp_semantic_tool_filter:
    enabled: false
    embedding_model: "embed-lfm"      # CPU-only LFM2.5-Embedding-350M (0 VRAM); alias tool-embed; was "embed" (Octen 4.4 GB)
    top_k: 5
    similarity_threshold: 0.3

general_settings:
  database_url: "os.environ/DATABASE_URL"       # litellm-db (:5433) — /key/generate + spend tracking
  store_model_in_db: false                      # YAML owns MCP/settings; DB still owns keys/spend
