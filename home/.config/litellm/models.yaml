# litellm model routes — the SHARED half of the gateway config (model_list +
# router_settings + prompts). Loaded via `include:` by BOTH profiles:
#   config.yaml      → gateway  :4000  (model routing only — fast, always-on)
#   config-mcp.yaml  → MCP-enabled instance :4001 (optional: `stack mcp`)
# litellm include semantics (proxy_server.py _process_includes): LISTS extend,
# DICTS replace — so router_settings/prompts must live ONLY here, never in a parent.

model_list:
  # ── embeddings (sift, oracle) — local always ──────────────────────────────────
- model_name: embed-lfm
  litellm_params:
    model: openai/embed-lfm                 # → llama-swap alias embed-lfm (LFM2.5-Embedding-350M, CPU)
    api_base: http://127.0.0.1:9292/v1
    api_key: "none"
    input_cost_per_token: 0
    output_cost_per_token: 0
    tags: ["embedding", "local", "lfm2", "multilingual"]
  model_info:
    engine: "llama.cpp"
    hf_repo: "LiquidAI/LFM2.5-Embedding-350M-GGUF"
    mode: embedding
    max_input_tokens: 512
    metadata:
      display_name: "Embed-LFM · LFM2.5-Embedding-350M (CPU, 1024-dim)"
      backend: "llama.cpp CUDA (RTX 5090) · LFM2.5-Embedding-350M-GGUF Q8_0, ~0.4 GB VRAM"
      role: "MCP tool semantic filter + fast multilingual embed (alias: tool-embed)"
      source_url: https://huggingface.co/LiquidAI/LFM2.5-Embedding-350M
- model_name: embed
  litellm_params:
    model: openai/nemotron-embed-1b        # embeddings dialect — keep openai/ (llamafile provider is chat-only)
    api_base: http://127.0.0.1:9292/v1     # llama-swap → Nemotron-3-Embed-1B NVFP4
    api_key: "none"
    input_cost_per_token: 0
    output_cost_per_token: 0
    tags:
    - "embedding"
    - "local"
    - "shared"
    - "nvidia"
    - "nvfp4"
  model_info:
    engine: "vllm"
    hf_repo: "nvidia/Nemotron-3-Embed-1B-NVFP4"
    mode: embedding
    input_cost_per_token: 0
    output_cost_per_token: 0
    max_input_tokens: 8192
    metadata:
      display_name: "Embed · Nemotron-3-Embed-1B NVFP4 (local)"
      backend: "vLLM CUDA (RTX 5090) · Nemotron-3-Embed-1B NVFP4, 2048-dim"
      vram: "~1 GB"
      quant: "NVFP4"
      role: "shared embedder for sift + oracle"
      tags: ["embedding", "local", "shared", "nvidia", "nvfp4"]
      source_url: https://huggingface.co/nvidia/Nemotron-3-Embed-1B-NVFP4

  # ── Infinity models (via llama-swap :9292/v1 — see llama-swap config, f2llm-embed/bge-rerank) ──
- model_name: embed-legal
  litellm_params:
    model: openai/embed-legal               # → llama-swap f2llm-embed (Infinity, /v1/embeddings)
    api_base: http://127.0.0.1:9292/v1
    api_key: "none"
