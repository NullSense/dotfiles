# ── Router aliases: legacy short names → new HF-identity model_names ─────────────
# hidden: true = excluded from /v1/models, /v1/model/info, /v1/model_group/info.
# Callers using the old names still route correctly; the hub shows only HF-identity names.
# (Confirmed syntax: litellm docs/proxy/load_balancing "Hide Alias Models")
  # ── primary local agent — Qwen3.8-27B stock NVFP4, vLLM ──────────────
