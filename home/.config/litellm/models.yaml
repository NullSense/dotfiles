    supported_environments: ["development"]
    mode: chat
    supports_function_calling: true
    max_input_tokens: 65536
    max_output_tokens: 8192
    metadata:
      display_name: "Summarize-fallback · Gemma-4 E4B (local llama.cpp, low floor)"
      backend: "llama.cpp E4B via llama-swap `gemma-4-e4b` (MODE=sum, ttl 300)"
      vram: "~6 GB allocated on demand (no pre-reserved fraction)"
      note: "same weights as the primary's E4B branch, without its 8 GB pre-flight refusal"
      tags: ["summarization", "local", "gemma", "fallback"]

- model_name: summarize-fallback
