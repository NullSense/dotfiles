      backend: "Infinity (native uv, RTX 5090 CUDA) via llama-swap · fp16, batch 128 (254 texts/s benchmarked)"
      role: "legalkb embedder; future sift legalkb-tenant embedding (2048-dim ⇒ separate sift vector-config, never interchangeable with 2560-dim `embed`)"
      source_url: https://huggingface.co/codefuse-ai/F2LLM-v2-1.7B
# ── NVIDIA Nemotron retrieval pair (2026-07-22) — sift embed+rerank candidates, vLLM v0.25 ──
- model_name: embed-nemotron
  litellm_params:
    model: openai/nemotron-embed-1b         # → llama-swap nemotron-embed-1b (vLLM /v1/embeddings)
    api_base: http://127.0.0.1:9292/v1
    api_key: "none"
    input_cost_per_token: 0
    output_cost_per_token: 0
    tags: ["embedding", "local", "nvidia", "nvfp4"]
    # ── Retries OFF on retrieval routes (2026-08-06) ──────────────────────────────
    # Both layers, because they are different mechanisms and the global
    # `num_retries: 2` in config.yaml would otherwise apply here:
    #   num_retries  → litellm ROUTER-level retry of the whole deployment call
    #   max_retries  → the underlying SDK client's own retry
    # Why 0: the failure this route actually has is a SLOW one, not a flaky one. If
    # llama-swap's swap engine evicted this model (a solo big-MoE load will), the next
    # call pays a ~50s cold start — a retry does not fix that, it triples it into a
    # 150s stall and can stack three concurrent cold loads onto one GPU.
    # timeout 120 bounds a single cold start generously without unbounded hanging.
    num_retries: 0
    max_retries: 0
    timeout: 120
  model_info:
    engine: "vllm"
    hf_repo: "nvidia/Nemotron-3-Embed-1B-NVFP4"
    mode: embedding
    max_input_tokens: 4096
    metadata:
      display_name: "Embed · Nemotron-3-Embed-1B NVFP4 (vLLM, 2048-dim)"
      backend: "vLLM v0.25.0 CUDA (RTX 5090, NVFP4-native on Blackwell) via llama-swap"
      role: "sift embed candidate. ⚠ /v1/embeddings needs 'query: '/'passage: ' prefixes client-side; 2048-dim ⇒ separate sift vector-config, never a drop-in for 2560-dim `embed`"
      source_url: https://huggingface.co/nvidia/Nemotron-3-Embed-1B-NVFP4
- model_name: rerank-nemotron
  litellm_params:
    model: hosted_vllm/nemotron-rerank-1b   # hosted_vllm rerank provider — parses vLLM's document-OBJECT results (infinity/ chokes on them: "document.text should be a valid string", verified 2026-07-22); URL: {api_base}/rerank → llama-swap → vLLM
    api_base: http://127.0.0.1:9292/v1
    api_key: "none"
    input_cost_per_token: 0
    output_cost_per_token: 0
    tags: ["rerank", "local", "nvidia"]
    # Retries OFF — same reasoning as embed-nemotron above (slow-not-flaky failure
    # mode; a retry triples a cold start instead of fixing it).
    num_retries: 0
    max_retries: 0
    timeout: 120
  model_info:
    engine: "vllm"
    hf_repo: "nvidia/llama-nemotron-rerank-1b-v2"
    mode: rerank
    metadata:
      display_name: "Rerank · llama-nemotron-rerank-1b-v2 (vLLM)"
      backend: "vLLM v0.25.0 CUDA (RTX 5090) via llama-swap · Llama-3.2-1B bidirectional cross-encoder, 8k pairs"
      role: "sift rerank candidate (pairs with embed-nemotron); A/B against rerank-legal/bge before any registry switch"
      source_url: https://huggingface.co/nvidia/llama-nemotron-rerank-1b-v2

