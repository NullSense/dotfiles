  # ── summarize-fallback: the rung that catches a failed primary ────────────────
  #    DEV → llama-swap `gemma-4-e4b` (llama.cpp E4B, MODE=sum).
  #
  #    The ONE property that matters in a fallback is a LOWER FLOOR than the primary
  #    — it is invoked precisely when the primary could not run. The 2026-08-13
  #    blackout: `summarize` is VRAM-adaptive and exits 1 below an 8 GB free-VRAM
  #    floor (llama-summarize-auto:38-40); during an Oracle ingest GLiNER2-large held
  #    the card, so it refused, and the only other rung was cloud DeepSeek — dead on
  #    OpenRouter 402. All 124 summaries lost.
  #
  #    `gemma-4-e4b` is the SAME binary+weights the primary execs when it picks E4B
  #    (llama-summarize-auto:37), minus the pre-flight gate: llama.cpp allocates the
  #    ~6 GB it actually needs instead of pre-reserving a fraction, so it starts in
  #    the 6-8 GB band where the primary gives up. Same benched quality (4.96
  #    faithfulness / 0% fabrication), no credits to exhaust.
  #
  #    ⚠ NOT `rewrite`, the obvious-looking pick: ttl:0 means never EVICTED once
  #    started, not already running — and it reserves GPU_UTIL=0.42 ≈ 13.2 GB, so it
  #    fails to start in exactly the squeeze it would be called for (verified live
  #    2026-08-13: "Free memory 11.04 GiB < desired 13.19 GiB"). A fallback with a
  #    HIGHER floor than the primary is not a fallback.
  #    PROD → cloud DeepSeek-v4-flash (no local GPU there); needs OPENROUTER_API_KEY.
- model_name: summarize-fallback
  litellm_params:                      # DEV → low-floor local llama.cpp E4B
    model: openai/gemma-4-e4b
    api_base: http://127.0.0.1:9292/v1
    api_key: "none"
    input_cost_per_token: 0
    output_cost_per_token: 0
