# ── VRAM coexistence (single 32 GB RTX 5090) ────────────────────────────────────────
# Default behavior (no matrix/groups): ONE model at a time — a request for model B
# unloads A. The `matrix` solver below instead keeps all small/medium models co-resident
# (32GB has the room) and lets only the big MoE models run solo. See the matrix block.
#
# ── matrix: solver-based concurrency (VALIDATED to parse on llama-swap v228, 2026-06-20) ──
# Semantics (docs/configuration.md): a model in NO set runs BY ITSELF (evicting all) —
# so every omitted big model keeps its current exclusive behavior, nothing breaks.
# `sets` is a MAPPING {name: DSL}; subset semantics = any subset of a set is a valid
# concurrent state. `evict_costs` = relative reload cost (higher → solver avoids
# evicting it). ⚠ llama-swap does NOT measure VRAM (maintainer: "users are responsible
# for resolving conflicts") — the set above is hand-estimated to fit 32 GB.
#
# CONFIRM headroom while the working set is loaded:
#       watch -n1 'nvidia-smi --query-gpu=memory.used --format=csv,noheader'
#   If it approaches ~31 GB, trim the `coresident` set. A timestamped backup of this
#   file is in this dir: config.yaml.bak-*  (restore = cp it back).
#   ⚠ NO RETENTION POLICY (noted 2026-08-15): 5 snapshots have accumulated here since 2026-06-20
#   (~140 KB total — not a space problem, but nothing prunes them and they're easy to lose track
#   of). Same gap for ~/bin/llm-servers/.bak/. Proposed policy: keep the most recent snapshot per
#   distinct reason and delete superseded ones once its config change is confirmed stable for a
#   few days; migration/rollback snapshots (e.g. the CUDA-migration `*.vulkan-amd` set, removed
#   2026-08-15 — see hyprwhspr-ai/docs/superpowers/specs/2026-06-25-rtx5090-cuda-migration-design.md)
#   should be deleted once the migration they insure against is confirmed done and the hardware/
#   dependency they'd roll back to no longer exists.
#
  # ── Qwen3.8-27B NVFP4 — long-context, parallel, multimodal lane ─────────────
  # Pinned 5090-specific ModelOpt export from the user-selected deployment recipe
  # (weights revision 69274a0d8dff5dd35bcee8290612f71e03b6e981). Live on this
  # desktop at 0.89: 18.51 GiB resident weights and 214,909 aggregate FP8-KV
  # tokens. That admits two independent ~100K workers with ~14K aggregate reserve.
  # Prefix caching can improve identical-prefix forks but is not capacity credit.
  # Eager mode deliberately trades some peak throughput for the 0.44 GiB CUDA
  # graph reservation that makes the two-worker context budget fit safely.
  qwen3.8-27b-nvfp4-long:
    cmd: >
      docker run --rm --name vllm-qwen38-long --init --gpus all
      --ipc host --network host --security-opt no-new-privileges
      -e PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
      -e VLLM_NO_USAGE_STATS=1
      -v /home/nullsense/.lmstudio/models/gittensor-model-hub/Qwen3.8-27B-NVFP4-RTX5090:/models/target:ro
      vllm/vllm-openai@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967
      /models/target
      --served-model-name qwen3.8-27b-nvfp4-long
      --host 127.0.0.1 --port ${PORT}
      --quantization modelopt
      --kv-cache-dtype fp8
      --max-model-len 210432
      --max-num-seqs 2
      --gpu-memory-utilization 0.89
      --enable-prefix-caching
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --trust-remote-code
      --enforce-eager
    cmdStop: docker stop -t 20 vllm-qwen38-long
    proxy: http://127.0.0.1:${PORT}
    useModelName: qwen3.8-27b-nvfp4-long
    ttl: 0
    name: "Qwen3.8-27B (vLLM NVFP4, long/parallel)"
    aliases: ["qwen3.8-27b-nvfp4-long:think", "qwen3.8-27b-nvfp4-long:fast"]
    description: "chat·agent·vision · stock Qwen3.8 NVFP4, 210K max request, measured 214,909-token aggregate pool, two ~100K workers"
    metadata: { engine: "vllm", hf: "gittensor-model-hub/Qwen3.8-27B-NVFP4-RTX5090@69274a0", class: "chat·agent·vision", thinking: "low or off per request", aggregate_context: 214909, max_concurrency: 2, tags: [chat, agent, vision, local, qwen, nvfp4, long-context, parallel] }
    filters:
