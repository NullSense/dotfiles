  # an eight-token verification window; there is no validated k=16 SGLang pair.
  # At mem-fraction=0.91 the first real request still failed a 512 MiB CUDA
  # allocation. The conservative 0.89 profile exposes 21,639 aggregate tokens
  # and passed a forced function-call canary. ReplaySSM cannot help: this image
