      python3 -m sglang.launch_server
      --trust-remote-code
      --model-path /models/target
      --served-model-name qwen3.8-27b-nvfp4-dspark
      --host 127.0.0.1 --port ${PORT}
      --context-length 16384
      --kv-cache-dtype fp8_e4m3
      --mem-fraction-static 0.89
