# llama-swap — local VRAM model swapper in front of the ~/bin/llama-* wrappers.
# Each model's `cmd` just CALLS the existing wrapper with the swap-assigned ${PORT},
# so every tuned flag (CUDA, MTP, KV-quant, samplers, MODE) is preserved — the
# wrappers stay the single source of truth. See ~/notes/LLM-STACK.md for the full design.
#
# Run:   llama-swap --config ~/.config/llama-swap/config.yaml --listen 127.0.0.1:9292
# Then:  curl http://127.0.0.1:9292/v1/models   |  web UI at http://127.0.0.1:9292/ui
# Install (host): paru -S llama-swap   (AUR)  OR  grab a release binary from
#   https://github.com/mostlygeek/llama-swap/releases  (Go, single binary, MIT, 4.5k★)
#
# VALIDATE before relying on it:  llama-swap --config <this> --listen 127.0.0.1:9292
#   prints config errors on startup. The `groups`/`routing` schema moved between versions
#   (see the commented block at the bottom) — verify against your installed version.

healthCheckTimeout: 300   # wrappers do no-mmap loads (+ first-run downloads) — be generous
globalTTL: 300            # default: unload a model 5 min after its last request
logLevel: info
startPort: 9300           # ${PORT} auto-increments from here per model

# ── PRELOAD sift's retrieval serving path (2026-08-06) ─────────────────────────────
# ttl:0 on nemotron-rerank-1b means "never idle-evict", NOT "already loaded" — after a
# llama-swap restart or a config reload, a pinned model is still cold until something
# asks for it. Preload is what closes that gap.
#
# Why it is worth the startup cost: a vLLM cold start on this box is ~50s end-to-end
# (measured 2026-08-06 — container 14s, engine spawn 12s, weights 2.5s, torch.compile
# 1.9s WITH a warm ~/.cache/vllm, CUDA-graph capture 9s, profile+API ~9s). sift bounds
# rerank at 10s (RERANK_TOTAL_BUDGET), so a cold reranker does not error — the query
# silently degrades to fused-only ranking. Paying that once at stack boot, off the
# request path, is strictly better than letting a user's first search absorb it.
#
# All three are in the `sift-serve` matrix set, so co-residency is permitted and they
# will not swap each other out. ~11 GB held from boot (n 3.8 + m 4.7 + x 2.5).
#
# tei-sparse used to preload alongside the Q4 chat model. The NVFP4 vLLM route
# reserves 89% of VRAM for its measured two-worker KV pool, so that combination
# is no longer safe. Sparse retrieval remains available on demand; llama-swap
# deliberately evicts Qwen for it and restores Qwen on the next agent request.
# ── vLLM sleep-mode swapping (2026-08-06) ─────────────────────────────────────────
# `vllm-wrapper` is llama-swap's own helper (v243+, cmd/vllm-wrapper) for driving
# vLLM's /sleep + /wake_up from cmd/cmdStop instead of killing the container. It is
# NOT in the Arch package — build it when llama-swap is upgraded:
#   go build -o ~/bin/vllm-wrapper ./cmd/vllm-wrapper   # from the matching git tag
#
# A sleep-wired model runs its daemon on a FIXED port from the block below, outside
# llama-swap's ${PORT} pool, because the daemon must outlive the "stop". llama-swap
# still routes through ${PORT} — vllm-wrapper reverse-proxies onto the fixed port.
# Keep these out of the ${PORT} range (startPort 9300+) so they can never collide.
#
# Only wire models where sleep actually pays: the saving equals weights + KV cache,
# since the CUDA context and captured graphs deliberately stay resident. Big
# generative models win hugely; small pooling/embedding models do not (see the note
# on nemotron-rerank-1b).
macros:
  vllm_wrapper: /home/nullsense/bin/vllm-wrapper
  vllm_nanbeige_port: 8010
  vllm_nanbeige_sift_port: 8011

hooks:
  on_startup:
    # Keep only the primary interactive model resident. Sift retrieval models load
    # on demand and are mutually exclusive with this two-worker 27B allocation.
    preload:
      - qwen3.8-27b-nvfp4-long

models:
  # ── embeddings: sift + oracle. On-demand, evicts when idle (was ttl:0 always-on). ──
  octen-embedding-4b:
    cmd: env PORT=${PORT} /home/nullsense/bin/llm-servers/llama-octen
    proxy: http://127.0.0.1:${PORT}
    ttl: 300              # evict after 5 min idle (matches globalTTL); no longer pinned in VRAM
    name: "Octen-Embedding-4B (Q8_0)"
    # `embed` alias REMOVED 2026-08-15 — it resolved here (2560-dim) while litellm's
    # logical `embed` at :4000 resolves to nemotron-embed-1b (2048-dim). One name, two
    # models, two dimensionalities, decided by which port you happened to hit. A wrong-dim
    # vector is caught inserting into a fixed-dim collection, but anything doing similarity
    # math on raw output just gets quiet nonsense. `embed` now means nemotron on BOTH layers.
    # Octen stays reachable by its explicit names so an existing 2560-dim index can still be
    # queried; nothing in oracle, sift or the pipeline references it any more (grepped).
    aliases: [octen-embed, qwen3-embedding-4b]
    description: "embedding · Octen-Embedding-4B (Qwen3-Embedding finetune), 2560-dim, last-token pooling. LEGACY: sift moved its dense leg to nemotron-embed-1b (2048-dim); kept only to read pre-cutover 2560-dim collections."
    metadata: { engine: "llama.cpp", hf: "Octen/Octen-Embedding-4B", class: embedding, thinking: na, best_for: "reading pre-cutover 2560-dim indexes", tags: [embedding, local, legacy] }

  # ── tool-search embedder — LFM2.5-Embedding-350M (1024-dim CLS), Vulkan GPU (~0.4 GB VRAM).
  #    Used by litellm mcp_semantic_tool_filter. Co-resident with the small models via the
  #    matrix (var `t`) so loading it NEVER evicts the chat model. First load auto-downloads
  #    the official llama.cpp GGUF (~379 MB Q8_0); needs a llama.cpp build with the `lfm2-bidir`
  #    arch (update llama.cpp if it errors "unknown architecture lfm2-bidir"; if the Vulkan
  #    backend lacks it, fall back to -ngl 0). Filter fails-open (all tools) if it can't load.
  lfm2-embed-350m:
    # ctx 8192 ≫ ubatch 512: -ub is the PER-INPUT token cap (pooled embeddings must fit one
    # ubatch); -c bounds the TOTAL tokens of a batched /v1/embeddings request. At -c 512 a
    # multi-input batch overflowed instantly ("Context size has been exceeded" — sift bulk
    # indexing, 2026-07-20). KV for 8k ctx on a 350M model is negligible VRAM.
    cmd: env PORT=${PORT} llama-server -hf LiquidAI/LFM2.5-Embedding-350M-GGUF:Q8_0 --embeddings --pooling cls --ctx-size 8192 --ubatch-size 512 --device CUDA0 -ngl 99 --host 127.0.0.1 --port ${PORT} --metrics
    proxy: http://127.0.0.1:${PORT}
    ttl: 3600
    name: "LFM2.5-Embedding-350M (tool search, CUDA GPU)"
    aliases: [embed-lfm, tool-embed, lfm2-embed]
    description: "embed·tools · LFM2.5-Embedding-350M 1024-dim CLS, CUDA GPU (~0.4 GB VRAM) — semantic MCP tool filter. Asymmetric query:/document: prefixes recommended."
    metadata: { engine: "llama.cpp", hf: "LiquidAI/LFM2.5-Embedding-350M-GGUF", class: embed, thinking: na, best_for: "MCP tool semantic search (litellm mcp_semantic_tool_filter)", tags: [embed, tools, local, lfm2, gpu, cuda] }

  # ── LEARNED-SPARSE (SPLADE-family) — sift's hybrid lexical leg (2026-07-31) ──────────────
  #    TEI is the only engine here that can serve SPLADE pooling: Infinity explicitly does
  #    not (michaelfeil/infinity#399), which is why this is its own entry and not another
  #    --model-id on the infinity image. `--pooling splade` is documented as working ONLY on
  #    "Bert and Distilbert MaskedLM architectures" — that constraint, not model quality, is
  #    what picked the model below.
  #
  #    MODEL: opensearch-neural-sparse-encoding-v2-distill — DistilBERT + MLM head, 67M,
  #    BEIR avg nDCG@10 0.528, Apache-2.0. That beats naver/splade-v3 (~0.520) at 60% the
  #    size. Stronger sparse models exist and were rejected on servability, not merit:
  #      doc-v3-gte  0.546, 8192 ctx — GTE arch, TEI cannot splade-pool it (needs a sidecar)
  #      LACONIC-1B  0.576 (BEIR14)  — Llama3 arch, same problem, and 15x the params
  #
  #    ⚠ SYMMETRIC — DO NOT swap in a `doc-`prefixed variant here. The `doc-*` models
  #    (doc-v2-distill, doc-v3-distill, doc-v3-gte) are INFERENCE-FREE: the model encodes
  #    documents only, and a query is a tokenizer + token→weight lookup table with no
  #    forward pass. Pointing this endpoint at one silently applies the DOCUMENT encoder to
  #    queries — off-distribution, no error, just quietly worse recall. Using one requires
  #    query-side lookup-table support in the client, which sift does not have.
  #
  #    CONSUMER: sift indexer + api via SparsePlan::Endpoint{format: Tei}. sift appends
  #    `/embed_sparse` itself (sift-indexer/src/silver/sparse_embedder.rs), so its base_url
  #    is llama-swap's per-model escape hatch — /embed_sparse carries no `model` field, so
  #    normal body-based routing cannot select this entry:
  #        http://127.0.0.1:9292/upstream/tei-sparse
  #
  #    5090 SIZING: the binding constraint is NOT the 67M of weights (~134 MB fp16) but the
  #    MLM logits tensor, which is [total_batch_tokens x 30522 vocab]. At 32768 batch tokens
  #    that is 32768*30522*2 B ≈ 2.0 GB of transient activation — raise --max-batch-tokens
  #    only with that multiplier in mind. --max-client-batch-size must stay >= sift's
  #    configured sparse batch_size or sift's batches get rejected at the door.
  #    --auto-truncate defaults to true (deliberately left default: sift chunks can exceed
  #    DistilBERT's 512 tokens, and truncating beats a 413).
  #    ⚠⚠ `--entrypoint text-embeddings-router` IS LOAD-BEARING — DO NOT REMOVE. ⚠⚠
  #    Without it the image runs its own /entrypoint.sh, which does:
  #        DRIVER_CUDA=$(nvidia-smi | awk '/CUDA Version/ {print $3; exit}')
  #    Our driver (610.43.03) prints "CUDA UMD Version: 13.3" — the newer nvidia-smi header
  #    format, which that regex does NOT match ("CUDA UMD Version" != "CUDA Version"). The
  #    parse yields empty, `${DRIVER_CUDA:-0.0.0}` makes it 0.0.0, the script concludes the
  #    host driver is ancient and prepends /usr/local/cuda/compat (libcuda 575.57.08) to
  #    LD_LIBRARY_PATH. CUDA forward-compat only works when the host driver is OLDER than
  #    the compat package; ours is NEWER, so libcuda 575 vs KMD 610 gives
  #    CUDA_ERROR_SYSTEM_DRIVER_MISMATCH (803).
  #    TEI then does NOT fail — it logs a WARN and silently falls back to
  #    "Starting DistilBert model on Cpu" + "forcing max_batch_requests=4", serving
  #    CORRECT results at a crawl. Nothing downstream errors; a bulk reindex just never
  #    finishes. Skipping the entrypoint uses the ldconfig-resolved host libcuda instead
  #    (/lib/libcuda.so.1 -> libcuda.so.610.43.03), which is what we want.
  #    VERIFY after any TEI bump — the log line must say Cuda, not Cpu:
  #        docker logs swap-tei-sparse 2>&1 | grep "Starting.*model on"
  #        want: "Starting FlashDistilBert model on Cuda(CudaDevice(DeviceId(1)))"
  #    Measured 2026-07-31: 2863 docs/s @ batch 128 on GPU. CPU path caps at batch 4.
  #    (Upstream added entrypoint.sh precisely to fix the CUDA 13.0+ compat break; the fix
  #     just doesn't survive this driver's nvidia-smi header. Recheck on a TEI upgrade —
  #     if their parser learns the new format, this override can go.)
  tei-sparse:
    cmd: >
      docker run --rm --name swap-tei-sparse --init --gpus all
      -p 127.0.0.1:${PORT}:80
      -v /home/nullsense/.cache/huggingface:/data
      --entrypoint text-embeddings-router
      ghcr.io/huggingface/text-embeddings-inference:120-1.9
      --model-id opensearch-project/opensearch-neural-sparse-encoding-v2-distill
      --pooling splade
      --dtype float16
      --max-batch-tokens 32768
      --max-client-batch-size 512
      --max-concurrent-requests 512
      --payload-limit 16000000
      --port 80
    cmdStop: docker stop -t 2 swap-tei-sparse
    proxy: http://127.0.0.1:${PORT}
    # Same reason as nemotron-embed-1b: llama-swap's internal default is 10 parallel
    # requests and #11 gets a 429. The sparse leg is embedded in the SAME Silver pass
    # as the dense leg, at the same concurrency, so it needs the same headroom.
    # TEI's own --max-concurrent-requests is 512, well above this.
    concurrencyLimit: 32
    # ttl:0 (PINNED) — 2026-08-06, was 3600, originally 300.
    # The 3600 was set because 300 was shorter than the gap between two search
    # sessions, so every return to work paid a cold load: measured 2026-08-03, an
    # idle-then-query cycle took 40-120s cold vs 42s warm and turned sift's own
    # ~1ms cache-warm search into ~10s or a 408 at the router's 30s ceiling.
    # Pinning removes the timer from the equation entirely. This entry is also in
    # hooks.on_startup.preload, so it is warm from boot rather than from first use.
    # Cheap to hold: ~2.5 GB peak, and the peak is MLM-logits activation, not weights.
    ttl: 0
    #
    # ⚠ 512-TOKEN INPUT CEILING — silent, and it is a TOKENIZER-MISMATCH problem.
    # Live `/info` (2026-08-06) reports max_input_length 512 with auto_truncate true.
    # 512 is the model's hard ceiling (DistilBERT position embeddings); no flag raises
    # it, and TEI truncates unconditionally — no error, nothing logged.
    #
    # How exposed we actually are: sift's live pipeline (sift_bronze pipeline id=1)
    # sets code/text/markdown_max_tokens ALL to 512, so it is not the gross
    # 768-into-512 overflow that sift's DEFAULT chunker targets (768 markdown /
    # 1024 code) would produce. But 512 is not 512 across tokenizers: sift chunks
    # with the Nemotron tokenizer (Mistral BPE) and TEI re-tokenizes with WordPiece
    # over a 30522 vocab, which generally yields MORE tokens for the same text. So
    # some chunks can still cross the line, and the sparse leg quietly loses their
    # tail while the dense leg (Nemotron, 4096) sees them whole.
    #   `--auto-truncate false` does NOT fix this; it converts silence into a hard
    #   rejection. Real fixes: measure the WordPiece length of real chunks and lower
    #   the chunk target to fit, or re-chunk the sparse leg at <=512 WordPiece tokens
    #   and max-pool the term weights. Both are retrieval-quality trades.
    # Re-check whenever the chunker's target tokens or the embedder's tokenizer change.
    #
    # BATCH-SIZE INVARIANT — 128 -> 512 on 2026-08-06. This was a LATENT BREAKAGE,
    # not a cosmetic disagreement: sift's docker-compose had already been moved to
    # 512 after a real failure ("batch size 134 > maximum allowed batch size 128"),
    # and this entry never got the fix. Anything routed here would have hit it again.
    #   --max-client-batch-size >= the largest request sift will actually send
    # Note the sizing rule that makes 128 too small: when transport.sparse.batch_size
    # is UNSET, sift sizes a sparse request by the DOCUMENT's chunk count, so a long
    # document alone can exceed 128. DEFAULT_SPARSE_HTTP_BATCH_SIZE = 12
    # (sift-indexer/src/silver/contract.rs) is the per-request default, not a cap on
    # this path — do not size this flag from that constant.
    # Nothing auto-syncs: sift reads only `model_id` from /info, never this field, so
    # the two definitions must be kept equal by hand. It is a pure request-validation
    # ceiling — GPU batching is governed by --max-batch-tokens, so a larger client
    # batch costs nothing until it lands.
    name: "OpenSearch neural-sparse v2-distill (TEI, SPLADE pooling)"
    # Bare `splade` alias REMOVED 2026-08-15. SPLADE here is the POOLING METHOD (TEI's
    # `--pooling splade`, required because this model's own config does not declare it), NOT
    # the model — the model is OpenSearch's neural-sparse v2-distill encoder. That distinction
    # has already cost once: sift's compose default was `Qdrant/Splade_PP_en_v1` while its
    # shipped pipeline example declared the opensearch encoder, and sparse_model is a free
    # string, so the mismatch produced cross-space nonsense with no dimension error to catch it
    # (see sift/docker-compose.yml's tei-sparse comment). An alias literally named `splade` is
    # the same trap. Nothing referenced it — grepped sift, pipeline and litellm.
    aliases: [sparse, sparse-embed, "opensearch-project/opensearch-neural-sparse-encoding-v2-distill"]
    description: "sparse · opensearch-neural-sparse-encoding-v2-distill 67M via TEI --pooling splade. BEIR 0.528 (> splade-v3 ~0.520 at 60% the size), 30522-dim over the BERT vocab, Apache-2.0. sift's hybrid lexical leg. Symmetric — queries run the model. ~2.5 GB peak."
    metadata: { engine: "TEI", hf: "opensearch-project/opensearch-neural-sparse-encoding-v2-distill", class: sparse, thinking: na, best_for: "sift hybrid retrieval sparse leg (learned lexical expansion)", tags: [sparse, neural-sparse, local, tei, opensearch, sift] }
    # ⚠ DUPLICATE SERVING PATH. sift's docker-compose.yml defines its own `tei-sparse`
    # service (profile `sparse`, 127.0.0.1:8082) running this SAME model and image. Both
    # resident = ~2.5 GB of duplicate encoder, and nothing reconciles them — sift reads only
    # `model_id` from /info, so flags can drift silently (they already did: 128 vs 512
    # max-client-batch-size until 2026-08-06). That comment asks to keep this entry in sync;
    # this is the reciprocal pointer. Preferred end state is single-owner: this entry is the
    # one instance, sift's dev path routes to :9292/upstream/tei-sparse, and the compose
    # service stays opt-in only for hermetic e2e/CI. Not done — needs a sift-side decision.

  # ── Infinity models (michaelfeil/infinity — native uv project, ~/Programming/llm-stack/infinity) ──
  #    One llama-swap entry per model = independent on-demand load/evict. All API routes live under
  #    /v1 (--url-prefix /v1 → /v1/embeddings, /v1/rerank verified 2026-07-18); /health stays at ROOT,
  #    which is llama-swap's default probe — do not add a checkEndpoint. useModelName pins the upstream
  #    model field so every alias (incl. the raw HF repo ids legalkb sends) routes correctly.
  #    Batch sizes = the 2026-07-02 RTX 5090 benchmarks from the infinity mise.toml (embed 128 →
  #    254 texts/s; VRAM scales with batch×seq — post-Absatz legalkb chunks p99≈370 tok keep it sane).
  #    Consumers: legalkb (via :9292/v1) today; sift legalkb-tenant later (provider=custom,
  #    model=embed-legal, dimensions=2048, api_base=http://127.0.0.1:9292/v1 — 2048 ≠ octen's 2560,
  #    so it is a SEPARATE sift vector-config/collection by construction, never a swap-in).
  f2llm-embed:
    # CONTAINERIZED 2026-07-18 (image built from the project's own uv.lock — Modal-ready;
    # native venv remains the dev fallback: swap `docker run …` for
    # `.venv/bin/infinity_emb v2 --host 127.0.0.1 --port ${PORT} <same flags>`).
    # Score parity container↔native verified (bge 0.45535 both).
    cmd: docker run --rm -e PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True --name swap-f2llm --init --gpus all -p 127.0.0.1:${PORT}:7997 -v /home/nullsense/.cache/huggingface:/hf infinity-serving:local --engine torch --device cuda --dtype float16 --no-bettertransformer --model-id codefuse-ai/F2LLM-v2-1.7B --revision 2af800f9d08546d675b1c7c522351ce1d900dc2e --served-model-name codefuse-ai/F2LLM-v2-1.7B@2af800f9d08546d675b1c7c522351ce1d900dc2e --batch-size 128 --url-prefix /v1
    cmdStop: docker stop swap-f2llm
    proxy: http://127.0.0.1:${PORT}
    useModelName: codefuse-ai/F2LLM-v2-1.7B@2af800f9d08546d675b1c7c522351ce1d900dc2e
    ttl: 300
    name: "F2LLM-v2-1.7B (Infinity, 2048-dim)"
    aliases: [embed-legal, f2llm, "codefuse-ai/F2LLM-v2-1.7B"]
    description: "embedding · F2LLM-v2-1.7B fp16 2048-dim via Infinity — wins German legal retrieval (GerDaLIR/LeCaRDv2, see legalkb 2026-07-02 reeval). legalkb embedder now; sift legalkb-tenant embedding later. Batch 128 (5090: 254 texts/s)."
    metadata: { engine: "infinity", hf: "codefuse-ai/F2LLM-v2-1.7B", class: embedding, thinking: na, best_for: "German legal retrieval (legalkb; future sift legalkb tenant)", tags: [embedding, local, legal, infinity] }

  bge-rerank:
    cmd: docker run --rm -e PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True --name swap-bge --init --gpus all -p 127.0.0.1:${PORT}:7997 -v /home/nullsense/.cache/huggingface:/hf infinity-serving:local --engine torch --device cuda --dtype float16 --no-bettertransformer --model-id BAAI/bge-reranker-v2-m3 --served-model-name bge-rerank --batch-size 16 --url-prefix /v1
    cmdStop: docker stop swap-bge
    proxy: http://127.0.0.1:${PORT}
    useModelName: bge-rerank
    ttl: 300
    name: "bge-reranker-v2-m3 (Infinity)"
    aliases: [rerank, rerank-legal, "BAAI/bge-reranker-v2-m3"]
    description: "rerank · bge-reranker-v2-m3 cross-encoder via Infinity (/v1/rerank, sigmoid scores). legalkb reranker now; local reranker candidate for sift's RerankerService. ~1.3 GB."
    metadata: { engine: "infinity", hf: "BAAI/bge-reranker-v2-m3", class: rerank, thinking: na, best_for: "cross-encoder reranking (legalkb; sift local rerank later)", tags: [rerank, local, legal, infinity] }

  # ── Reranker fleet (2026-07-18) — four models, three backends, one contract (/v1/rerank) ──
  #    Default `rerank` alias stays on bge-rerank (cheapest, MIRACL-strongest). The others are
  #    opt-in tiers: rerank-strong (Qwen3-4B via llama.cpp — the 2026-07-02 legalkb merit pick,
  #    now servable since llama.cpp #15824), rerank-fast (jina-v3 listwise sidecar — BEIR SOTA
  #    at 0.6B), rerank-max (zerank-2 via the rerank sidecar — tops ELO boards; ⚠ CC-BY-NC
  #    weights, fine for personal use, NOT for commercial serving). Raw HF repo-ids are aliases so clients
  #    can pass them verbatim. A/B on German legal pairs before changing legalkb's registry.
  qwen3-reranker-4b:
    # ⚠ GGUF MUST be the official-converter build (Voodisss) — community conversions lack
    #   cls.output.weight → garbage 4.5e-23 scores (llama.cpp #16407). --reranking implies
    #   pooling=rank + embedding. -np 4 parallelizes doc scoring within /v1/rerank.
    # ctx 16384/np4 = 4k per rerank slot (query+doc pairs are short) + q8 KV — keeps the whole
    # process ~6 GB so it coexists in legal-q; 32k f16 KV (~9 GB total) OOM'd next to rewrite.
    cmd: env PORT=${PORT} llama-server --model /home/nullsense/.lmstudio/models/Voodisss/Qwen3-Reranker-4B-GGUF-llama_cpp/Qwen3-Reranker-4B.Q8_0.gguf --reranking --device CUDA0 -ngl 99 --ctx-size 32768 -np 4 --batch-size 8192 --ubatch-size 8192 --flash-attn on --cache-type-k q8_0 --cache-type-v q8_0 --no-mmap --host 127.0.0.1 --port ${PORT} --metrics
    proxy: http://127.0.0.1:${PORT}
    ttl: 300
    name: "Qwen3-Reranker-4B (llama.cpp Q8_0)"
    aliases: [rerank-strong, "Qwen/Qwen3-Reranker-4B"]
    description: "rerank · Qwen3-Reranker-4B Q8_0 via llama.cpp native rerank (yes/no head). The legalkb 2026-07-02 merit pick, unblocked from infinity's ST pin. MTEB-R 69.76, MIRACL 67.52. ~4.3 GB."
    metadata: { engine: "llama.cpp", hf: "Qwen/Qwen3-Reranker-4B", class: rerank, thinking: na, best_for: "strong multilingual reranking (legalkb candidate; sift later)", tags: [rerank, local, qwen, llamacpp] }

  jina-reranker-v3:
    # Custom listwise arch (last-but-not-late, trust_remote_code) — not servable by infinity or
    # mainline llama.cpp (PR #22576 draft), so a minimal transformers sidecar speaks /v1/rerank.
    # Scores ≤64 docs in ONE forward pass (131K window) — fastest quality tier.
