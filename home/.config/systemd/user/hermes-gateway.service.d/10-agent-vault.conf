[Unit]
After=agent-vault.service hindsight-hermes.service headroom-hermes.service litellm-mcp.service
Wants=agent-vault.service hindsight-hermes.service headroom-hermes.service litellm-mcp.service

[Service]
# Keep Hermes's generated base unit vendor-owned. This drop-in is the durable
# credential boundary and survives `hermes gateway` refreshing the base unit.
LoadCredentialEncrypted=hermes-agent-vault-token:%h/.config/credstore.encrypted/hermes-agent-vault-token.cred
LoadCredentialEncrypted=hermes-hass-token:%h/.config/credstore.encrypted/hermes-hass-token.cred
LoadCredentialEncrypted=hermes-litellm-key:%h/.config/credstore.encrypted/hermes-litellm-key.cred
Environment="AGENT_VAULT_ADDR=http://127.0.0.1:14321"
Environment="AGENT_VAULT_VAULT=hermes"
Environment="HERMES_HOME=/home/nullsense/.hermes"

# Readiness gate. agent-vault.service is Type=simple, so `After=` only orders the
# *start* of the two units — systemd considers agent-vault "started" the instant it
# forks, long before it accepts on :14321. Hermes resolves every secret through
# `agent-vault run` (see ~/.local/libexec/hermes-secret-env), so starting into a
# not-yet-listening vault yields "no secrets applied"; the Telegram placeholder then
# reaches the API, and Hermes exits 78/CONFIG — which RestartPreventExitStatus=78
# (correctly) refuses to restart. Observed 2026-08-17 05:05. Poll until the vault
# accepts, then start. Keep the 78 guard: it is the right semantics for a genuine
# config error, so the fix belongs here, not in the restart policy.
ExecStartPre=/usr/bin/bash -c 'for i in {1..30}; do (exec 3<>/dev/tcp/127.0.0.1/14321) 2>/dev/null && exit 0; sleep 1; done; echo "agent-vault not accepting on 127.0.0.1:14321 after 30s" >&2; exit 1'

ExecStart=
ExecStart=/home/nullsense/.hermes/hermes-agent/venv/bin/python -m hermes_cli.main gateway run
