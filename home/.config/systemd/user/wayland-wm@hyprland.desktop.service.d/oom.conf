# Protect the Wayland compositor from the kernel OOM killer.
# Default (omarchy/uwsm) ships OOMScoreAdjust=200, which marks the compositor
# as a PREFERRED kill target — backwards. A runaway job killed the whole
# session this way on 2026-06-19 (30GB python3 -> global OOM).
#
# Heavy jobs now run in their own slice (see ~/.local/bin/heavy), so they no
# longer inherit this negative score from the session cgroup.
#
# 2026-07-30: the above was NOT enough — the session died again anyway, and
# OOMScoreAdjust was never the reason. It worked: Hyprland was never chosen as
# the OOM victim (the victim was a 30GB-shmem AWQ job at oom_score_adj +100).
# The session died because this unit shipped OOMPolicy=stop, systemd's default:
# when ANY process in the unit's cgroup is OOM-killed, systemd stops the WHOLE
# unit. That cascaded — graphical-session.target down, XDG autostart stopped,
# zedra and both claude sessions killed as collateral. None of them was the
# OOM target.
#
#   02:56:51 wayland-wm@hyprland.desktop.service: The kernel OOM killer killed
#            some processes in this unit.
#   02:56:51 Stopping elephant... / hypridle... / swaybg...   <-- OOMPolicy=stop
#
# OOMPolicy=continue keeps the compositor (and therefore the session) up when a
# child job is reaped. Protecting the compositor from being KILLED and stopping
# systemd from TEARING IT DOWN are two different things; we only had the first.
#
# Still pair this with ~/.local/bin/heavy for big jobs: running them in their
# own scope keeps them out of this cgroup entirely, so the unit never sees an
# OOM kill in the first place. Defence in depth.
#
# Takes effect on next compositor start (i.e. next login).
[Service]
OOMScoreAdjust=-800
OOMPolicy=continue
