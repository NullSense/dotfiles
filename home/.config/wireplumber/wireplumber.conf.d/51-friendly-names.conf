# Override device descriptions so pavucontrol / waybar / app pickers show
# human-friendly names instead of vendor jargon.
#
# Matches use "~" (regex) on the PCI function rather than full bus addresses:
# the bus numbers moved twice (RTX 5090 swap, iGPU disabled in BIOS) and silently
# broke exact-name rules each time.

monitor.alsa.rules = [
  # Onboard Realtek ALC1220 (AMD "Ryzen HD Audio Controller", PCI function .6).
  # The front-panel headphone jack sensor reports "plugged" with nothing in it, so
  # automatic port switching keeps jumping to the empty Headphones port. Headphones
  # live in a rear jack -> port Line Out. Keep port selection manual (WirePlumber
  # then restores the saved Line Out route).
  { matches = [ { device.name = "~alsa_card\\.pci-.*_00\\.6$" } ]
    actions = { update-props = { api.acp.auto-port = false } } }

  { matches = [ { node.name = "~alsa_output\\.pci-.*_00\\.6\\.analog-stereo$" } ]
    actions = { update-props = { node.description = "Headphones (rear jack)" } } }

  # RTX 5090 HDMI/DP audio -> the AORUS monitor's speakers.
  { matches = [ { node.name = "~alsa_output\\.pci-.*_00\\.1\\.hdmi-stereo.*" } ]
    actions = { update-props = { node.description = "Aorus FO32U2 speakers" } } }

  { matches = [ { node.name = "alsa_input.usb-Samson_Technologies_Samson_Q2U_Microphone-00.analog-stereo" } ]
    actions = { update-props = { node.description = "Q2U (raw)" } } }

]

# easyeffects_source is created by the EasyEffects daemon (not an ALSA device),
# so it needs node.rules rather than monitor.alsa.rules.
node.rules = [
  { matches = [ { node.name = "easyeffects_source" } ]
    actions = { update-props = { node.description = "Voice (Cleaned)" } } }
]
